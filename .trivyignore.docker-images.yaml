# Suppressions for Docker image scans (backend + database migration images).
# Everything below lives in the node:24-alpine base: its bundled npm CLI
# (usr/local/lib/node_modules/npm/node_modules), which the containers never
# invoke since they only run `node dist/...`, and its Alpine openssl packages.
# Not fixable via pnpm overrides; each clears once the base ships the fix.
#
# Do NOT merge into the root .trivyignore: that one is read by the dependency
# scan of our own lockfile, which must keep catching these CVEs in app code.

vulnerabilities:
  # brace-expansion@5.0.7, two CVE ids for the same copy. Fixed in 5.0.8 / 5.0.9.
  # App tree resolves >= 5.0.9.
  - id: CVE-2026-14257
    statement: "brace-expansion ReDoS. npm never invoked at runtime."
    expired_at: 2026-11-05
  - id: CVE-2026-69152
    statement: "DoS via unbounded arrays, same copy."
    expired_at: 2026-11-05

  # Pinned by purl: a bumped base that still ships a vulnerable tar re-fails the
  # scan instead of inheriting a suppression for a different bundled npm copy.
  # tar@7.5.19, fixed in 7.5.21.
  - id: CVE-2026-73566
    purls:
      - "pkg:npm/tar@7.5.19"
    statement: "tar DoS via crafted long-path archive. npm extracts nothing at runtime."
    expired_at: 2026-11-05

  # ip-address@10.2.0 (via socks), fixed in 10.3.1. Not in our lockfile at all.
  - id: CVE-2026-69192
    statement: "ip-address octet-parsing confusion. No SOCKS proxying."
    expired_at: 2026-11-05

  # libssl3 / libcrypto3@3.5.7-r0 (alpine 3.24), fixed in 3.5.8-r0.
  - id: CVE-2026-14456
    statement: "OpenSSL QUIC server memory-growth DoS. Node runs no QUIC server."
    expired_at: 2026-11-05
