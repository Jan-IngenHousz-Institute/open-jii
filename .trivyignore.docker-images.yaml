# Suppressions for Docker image scans (backend + database migration images).
# Everything below lives in the node:24-alpine base's bundled npm CLI
# (usr/local/lib/node_modules/npm/node_modules), which the containers never
# invoke: they only run `node dist/...`. Not fixable via pnpm overrides; each
# clears once the base bundles an npm with the fixed version.
#
# Do NOT merge into the root .trivyignore: that one is read by the dependency
# scan of our own lockfile, which must keep catching these CVEs in app code.

vulnerabilities:
  # purls pin a suppression to the detected copy: a bumped base that ships a
  # different vulnerable version re-fails the scan instead of inheriting it.

  # brace-expansion@5.0.7, four CVE ids for the same copy. Fixed by 5.0.11.
  # App tree resolves >= 5.0.12.
  - id: CVE-2026-14257
    purls:
      - "pkg:npm/brace-expansion@5.0.7"
    statement: "brace-expansion ReDoS. npm never invoked at runtime."
    expired_at: 2026-11-05
  - id: CVE-2026-69152
    purls:
      - "pkg:npm/brace-expansion@5.0.7"
    statement: "DoS via unbounded arrays, same copy."
    expired_at: 2026-11-05
  - id: CVE-2026-102276
    purls:
      - "pkg:npm/brace-expansion@5.0.7"
    statement: "Stack exhaustion from crafted brace patterns, same copy."
    expired_at: 2026-11-05
  - id: CVE-2026-102278
    purls:
      - "pkg:npm/brace-expansion@5.0.7"
    statement: "Uncontrolled recursion in nested brace patterns, same copy."
    expired_at: 2026-11-05

  # undici@6.27.0, fixed in 6.28.1. App tree resolves >= 6.29.0.
  - id: CVE-2026-19534
    purls:
      - "pkg:npm/undici@6.27.0"
    statement: "undici WebSocket subprotocol DoS. npm opens no WebSockets."
    expired_at: 2026-11-05

  # tar@7.5.19, fixed in 7.5.21.
  - id: CVE-2026-73566
    purls:
      - "pkg:npm/tar@7.5.19"
    statement: "tar DoS via crafted long-path archive. npm extracts nothing at runtime."
    expired_at: 2026-11-05

  # ip-address@10.2.0 (via socks), fixed in 10.3.1. Not in our lockfile at all.
  - id: CVE-2026-69192
    purls:
      - "pkg:npm/ip-address@10.2.0"
    statement: "ip-address octet-parsing confusion. No SOCKS proxying."
    expired_at: 2026-11-05
