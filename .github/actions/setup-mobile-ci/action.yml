name: "Setup mobile CI environment"
description: "Sets up Node.js, pnpm, and Expo/EAS CLI. Call after actions/checkout."
inputs:
  node-version:
    description: "Node.js version"
    required: false
    default: "24"
  expo-token:
    description: "Expo access token (typically secrets.EXPO_TOKEN)"
    required: true

runs:
  using: "composite"
  steps:
    - name: Setup Node.js and pnpm
      uses: ./.github/actions/setup-nodejs-pnpm
      with:
        node-version: ${{ inputs.node-version }}

    - name: Setup Expo CLI
      uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # 9
      with:
        expo-version: latest
        eas-version: latest
        token: ${{ inputs.expo-token }}
