name: "Docker Build Check"
description: "Builds a Docker image (no push) and scans it with Trivy"

inputs:
  image-name:
    description: "Name/tag for the built image (e.g. open-jii-backend:pr-check)"
    required: true
  dockerfile:
    description: "Path to the Dockerfile relative to the context"
    required: true
  context:
    description: "Docker build context path"
    required: false
    default: "."
  platforms:
    description: "Target platform(s) for the build"
    required: false
    default: "linux/amd64"
  build-args:
    description: "Newline-separated list of build args (KEY=VALUE)"
    required: false
    default: ""
  trivyignores:
    description: "Path to .trivyignore or .trivyignore.yaml file"
    required: false
    default: ".trivyignore"
  trivy-severity:
    description: "Trivy severity levels to fail on"
    required: false
    default: "CRITICAL,HIGH"
  use-gha-cache:
    description: "Whether to use GitHub Actions build cache"
    required: false
    default: "true"
  cache-scope:
    description: "GitHub Actions cache scope, one per image so images do not overwrite each other"
    required: false
    default: "buildkit"
  scan:
    description: "Whether to scan the built image with Trivy"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    # Dockerfiles declare APK_REFRESH before `apk upgrade`, so that layer leaves the cache weekly.
    - name: Compute Cache Week
      id: week
      shell: bash
      run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

    - name: Build Docker image (no push)
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        platforms: ${{ inputs.platforms }}
        push: false
        # Only the scan reads the built image.
        load: ${{ inputs.scan == 'true' }}
        tags: ${{ inputs.image-name }}
        build-args: |
          ${{ inputs.build-args }}
          APK_REFRESH=${{ steps.week.outputs.week }}
        cache-from: ${{ inputs.use-gha-cache == 'true' && format('type=gha,scope={0}', inputs.cache-scope) || '' }}
        # Only main writes, so the 10 GB repository cache holds one copy per image rather than one per pull request.
        cache-to: ${{ inputs.use-gha-cache == 'true' && github.ref == 'refs/heads/main' && format('type=gha,scope={0},mode=max', inputs.cache-scope) || '' }}

    - name: Scan Docker image with Trivy
      if: inputs.scan == 'true'
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: ${{ inputs.image-name }}
        format: table
        exit-code: 1
        severity: ${{ inputs.trivy-severity }}
        vuln-type: os,library
        ignore-unfixed: true
        trivyignores: ${{ inputs.trivyignores }}
