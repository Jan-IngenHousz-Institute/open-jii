name: "OpenTofu Plan"
description: "Runs OpenTofu plan"
inputs:
  lock:
    description: "Hold the state lock while planning"
    required: false
    default: "true"
  refresh:
    description: "Read every resource before planning; false compares the configuration with the state"
    required: false
    default: "true"
  out:
    description: "Absolute path to save the plan to, for an apply to use; empty saves nothing"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Resolve Environment
      shell: bash
      run: |
        if [[ "${{ env.environment }}" == "prod" ]]; then
          echo "RESOLVED_ENV=prod" >> "$GITHUB_ENV"
        else
          echo "RESOLVED_ENV=dev" >> "$GITHUB_ENV"
        fi
    - name: OpenTofu Plan
      shell: bash
      working-directory: infrastructure/env/${{ env.RESOLVED_ENV }}
      env:
        LOCK: ${{ inputs.lock }}
        REFRESH: ${{ inputs.refresh }}
        OUT: ${{ inputs.out }}
      run: |
        exec 2>&1
        tofu plan -input=false -lock="$LOCK" -refresh="$REFRESH" ${OUT:+-out="$OUT"}
