name: "OpenTofu Plan"
description: "Runs OpenTofu plan"
inputs:
  lock:
    description: "Hold the state lock while planning. A plan that is never applied does not need it."
    required: false
    default: "true"
runs:
  using: "composite"
  steps:
    - name: Resolve Environment
      shell: bash
      run: |
        if [[ "${{ env.environment }}" == "prod" ]]; then
          echo "RESOLVED_ENV=prod" >> "$GITHUB_ENV"
        else
          echo "RESOLVED_ENV=dev" >> "$GITHUB_ENV"
        fi
    - name: OpenTofu Plan
      shell: bash
      working-directory: infrastructure/env/${{ env.RESOLVED_ENV }}
      env:
        LOCK: ${{ inputs.lock }}
      run: |
        exec 2>&1
        tofu plan -lock="$LOCK"
