name: "Grafana Token"
description: "Creates a Grafana service account token that lives only as long as this run"
inputs:
  workspace_id:
    description: "Amazon Managed Grafana workspace id"
    required: true
  service_account_id:
    description: "Service account the token is created for"
    required: true
  seconds_to_live:
    description: "How long the token works, in seconds"
    required: false
    default: "3600"
outputs:
  token:
    description: "The token, masked in the logs"
    value: ${{ steps.create.outputs.token }}
  token_id:
    description: "The token's id, for deleting it when the run ends"
    value: ${{ steps.create.outputs.token_id }}
runs:
  using: "composite"
  steps:
    # Expired tokens still count toward the workspace's fixed quota of 100, so a run that could
    # not delete its own token would otherwise use up a slot for good.
    - name: Delete expired CI tokens
      shell: bash
      env:
        WORKSPACE_ID: ${{ inputs.workspace_id }}
        SERVICE_ACCOUNT_ID: ${{ inputs.service_account_id }}
      run: |
        NOW=$(date -u +%Y-%m-%dT%H:%M:%S)
        if ! EXPIRED=$(aws grafana list-workspace-service-account-tokens \
          --workspace-id "$WORKSPACE_ID" \
          --service-account-id "$SERVICE_ACCOUNT_ID" \
          --output json \
          | jq -r --arg now "$NOW" '.serviceAccountTokens[] | select((.name | startswith("ci-")) and .expiresAt != null and .expiresAt[0:19] < $now) | .id'); then
          echo "::warning::Could not list Grafana tokens, so expired ones stay until a later run"
          exit 0
        fi
        for TOKEN_ID in $EXPIRED; do
          aws grafana delete-workspace-service-account-token \
            --workspace-id "$WORKSPACE_ID" \
            --service-account-id "$SERVICE_ACCOUNT_ID" \
            --token-id "$TOKEN_ID" \
            || echo "::warning::Could not delete expired Grafana token $TOKEN_ID"
        done

    - name: Create the token
      id: create
      shell: bash
      env:
        WORKSPACE_ID: ${{ inputs.workspace_id }}
        SERVICE_ACCOUNT_ID: ${{ inputs.service_account_id }}
        SECONDS_TO_LIVE: ${{ inputs.seconds_to_live }}
      run: |
        OUTPUT=$(aws grafana create-workspace-service-account-token \
          --workspace-id "$WORKSPACE_ID" \
          --service-account-id "$SERVICE_ACCOUNT_ID" \
          --name "ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB" \
          --seconds-to-live "$SECONDS_TO_LIVE")
        TOKEN=$(echo "$OUTPUT" | jq -r '.serviceAccountToken.key')
        echo "::add-mask::$TOKEN"
        echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
        echo "token_id=$(echo "$OUTPUT" | jq -r '.serviceAccountToken.id')" >> "$GITHUB_OUTPUT"
