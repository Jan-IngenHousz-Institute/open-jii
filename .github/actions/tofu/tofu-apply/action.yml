name: "OpenTofu Apply"
description: "Runs OpenTofu apply"
inputs:
  root:
    description: "Directory under infrastructure/ that holds the environment roots: env or foundation"
    required: false
    default: "env"
  plan_file:
    description: "Absolute path of a saved plan to apply exactly; empty plans again and applies"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Resolve Environment
      shell: bash
      run: |
        if [[ "${{ env.environment }}" == "prod" ]]; then
          echo "RESOLVED_ENV=prod" >> "$GITHUB_ENV"
        else
          echo "RESOLVED_ENV=dev" >> "$GITHUB_ENV"
        fi
    - name: OpenTofu Apply
      shell: bash
      working-directory: infrastructure/${{ inputs.root }}/${{ env.RESOLVED_ENV }}
      env:
        PLAN_FILE: ${{ inputs.plan_file }}
      # A saved plan applies as it was approved, and OpenTofu refuses it once the state has moved on.
      run: |
        if [ -n "$PLAN_FILE" ]; then
          tofu apply -input=false "$PLAN_FILE"
        else
          tofu apply -input=false -auto-approve
        fi
