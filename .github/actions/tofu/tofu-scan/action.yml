name: "OpenTofu Security Scan"
description: "Static IaC misconfiguration scan of infrastructure/ with Trivy. Fails on CRITICAL/HIGH. Accepted findings are suppressed inline with #trivy:ignore annotations next to the resource."
runs:
  using: "composite"
  steps:
    - name: Trivy IaC misconfiguration scan
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        scan-type: config
        scan-ref: infrastructure
        format: table
        exit-code: 1
        severity: CRITICAL,HIGH
        skip-dirs: "**/.terraform"
