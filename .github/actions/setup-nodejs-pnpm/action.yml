name: "Setup Node.js and pnpm"
description: "Sets up Node.js and pnpm with caching and optional hoisted installation"
inputs:
  node-version:
    description: "Node.js version"
    required: true
    default: "24"
  hoisted:
    description: "Use hoisted node linker (required for AWS Lambda deployments)"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}

    # pnpm moves its store between versions, so ask it rather than hardcode the path.
    - name: Locate pnpm Store
      id: pnpm-store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    # Only main saves the store: a pull request's copy could only ever be read by that pull
    # request. A changed lockfile starts from main's newest store and downloads the difference.
    - name: Restore pnpm Store
      id: pnpm-store-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-store-${{ runner.os }}-${{ runner.arch }}-

    - name: Install Dependencies (Standard)
      if: inputs.hoisted == 'false'
      shell: bash
      run: |
        echo "Installing dependencies with standard pnpm (symlinks)..."
        pnpm install --frozen-lockfile

    - name: Install Dependencies (Hoisted)
      if: inputs.hoisted == 'true'
      shell: bash
      run: |
        echo "Installing dependencies with hoisted node linker (AWS Lambda compatible)..."
        # Persisted, not a CLI flag: pnpm 11's verifyDepsBeforeRun would otherwise reinstall symlinked on the next pnpm run
        pnpm config set --location project node-linker hoisted
        pnpm install --frozen-lockfile

    # A store restored from an older lockfile still holds packages this one dropped.
    - name: Prune pnpm Store
      if: github.ref == 'refs/heads/main' && steps.pnpm-store-cache.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm store prune

    - name: Save pnpm Store
      if: github.ref == 'refs/heads/main' && steps.pnpm-store-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: ${{ steps.pnpm-store-cache.outputs.cache-primary-key }}
