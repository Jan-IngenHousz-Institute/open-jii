name: "Setup Node.js and pnpm"
description: "Sets up Node.js and pnpm with caching and optional hoisted installation"
inputs:
  node-version:
    description: "Node.js version"
    required: true
    default: "24"
  hoisted:
    description: "Use hoisted node linker (required for AWS Lambda deployments)"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Cache pnpm Store
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.pnpm-store
        key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}-${{ inputs.hoisted }}
        restore-keys: |
          ${{ runner.os }}-pnpm-${{ inputs.hoisted }}-
          ${{ runner.os }}-pnpm-

    - name: Install Dependencies (Standard)
      if: inputs.hoisted == 'false'
      shell: bash
      run: |
        echo "Installing dependencies with standard pnpm (symlinks)..."
        pnpm install --frozen-lockfile

    - name: Install Dependencies (Hoisted)
      if: inputs.hoisted == 'true'
      shell: bash
      run: |
        echo "Installing dependencies with hoisted node linker (AWS Lambda compatible)..."
        # Persisted, not a CLI flag: pnpm 11's verifyDepsBeforeRun would otherwise reinstall symlinked on the next pnpm run
        pnpm config set --location project node-linker hoisted
        pnpm install --frozen-lockfile
