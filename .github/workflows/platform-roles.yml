# Platform Roles Workflow
# Grants, revokes or lists platform roles by running `dist/platform-roles.js` in the migration
# runner task, the only path from GitHub to a deployed database. A prod grant or revoke waits for
# one approval from someone other than the person who started the run. The repository is public,
# so inputs and output name accounts by user id only.

name: Platform Roles Workflow

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "The environment whose database to change"
        required: true
        type: choice
        options:
          - dev
          - prod
      action:
        description: "What to do"
        required: true
        type: choice
        default: list
        options:
          - list
          - grant
          - revoke
      role:
        description: "The platform role to grant or revoke"
        required: true
        type: choice
        options:
          - platform_admin
      target_user_id:
        description: "User id of the account to change (grant and revoke)"
        required: false
        type: string
      actor_user_id:
        description: "Your own openJII user id, recorded as the actor (grant and revoke)"
        required: false
        type: string

permissions: {}

concurrency:
  group: platform-roles-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Input
    runs-on: ubuntu-latest
    steps:
      # workflow_dispatch accepts any branch, and the checkout below would load that branch's
      # composite action with the deploy role. Belt to each environment's own deployment-branch
      # rule, which is the real control, not a replacement for it.
      - name: Refuse to run from a non-default ref
        if: github.ref != 'refs/heads/main'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::Platform roles change from main only; got $REF"
          exit 1

      # The summary is on the run page before approval, so the approver sees the exact change.
      - name: Validate input
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          ACTION: ${{ inputs.action }}
          ROLE: ${{ inputs.role }}
          TARGET: ${{ inputs.target_user_id }}
          ACTOR: ${{ inputs.actor_user_id }}
        run: |
          uuid='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          if [[ "$ACTION" == "list" ]]; then
            echo "### Requested: list platform roles on $ENVIRONMENT" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ ! "$TARGET" =~ $uuid || ! "$ACTOR" =~ $uuid ]]; then
            echo "::error::Grant and revoke need target_user_id and actor_user_id as user ids"
            exit 1
          fi
          {
            echo "### Requested: $ACTION $ROLE on $ENVIRONMENT"
            echo "- Target user id: \`$TARGET\`"
            echo "- Actor user id: \`$ACTOR\`"
            echo "- Started by: \`$GITHUB_ACTOR\`, this attempt by \`$GITHUB_TRIGGERING_ACTOR\` (attempt $GITHUB_RUN_ATTEMPT)"
          } >> "$GITHUB_STEP_SUMMARY"

  approval:
    name: Approval
    needs: validate
    if: inputs.environment == 'prod' && inputs.action != 'list'
    runs-on: ubuntu-latest
    environment: prod-approval
    steps:
      - name: Record approval
        env:
          ACTION: ${{ inputs.action }}
          ROLE: ${{ inputs.role }}
          TARGET: ${{ inputs.target_user_id }}
        run: echo "Approved $ACTION of $ROLE on prod for $TARGET."

  change:
    name: Run Platform Role Command
    needs: [validate, approval]
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    timeout-minutes: 20
    steps:
      # workflow_dispatch accepts any branch, and the checkout below would load that branch's
      # composite action with the deploy role. Belt to each environment's own deployment-branch
      # rule, which is the real control, not a replacement for it.
      - name: Refuse to run from a non-default ref
        if: github.ref != 'refs/heads/main'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::Platform roles change from main only; got $REF"
          exit 1

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Get Infrastructure Configuration
        uses: ./.github/actions/get-infrastructure-config
        with:
          environment: ${{ inputs.environment }}
          prefix: "/migration"

      # The latest revision runs the image the last migration run built. A migration run can
      # build from any ref, so the image's commit has to be on main before it may change a role.
      - name: Run the command in the migration runner task
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ACTION: ${{ inputs.action }}
          ROLE: ${{ inputs.role }}
          TARGET: ${{ inputs.target_user_id }}
          ACTOR: ${{ inputs.actor_user_id }}
          GITHUB_RUN: ${{ github.run_id }}
          # A rerun keeps the original actor and run id, so record who started this attempt too.
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          for name in ECS_CLUSTER_NAME TASK_DEFINITION_FAMILY CONTAINER_NAME SUBNETS SECURITY_GROUP_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing $name from the /migration/$ENVIRONMENT/ parameters"
              exit 1
            fi
          done

          aws ecs describe-task-definition --task-definition "$TASK_DEFINITION_FAMILY" \
            --query taskDefinition --output json > task-definition.json
          TASK_DEF=$(jq -r .taskDefinitionArn task-definition.json)
          IMAGE=$(jq -r --arg c "$CONTAINER_NAME" '.containerDefinitions[] | select(.name==$c) | .image' task-definition.json)
          if [[ ! "$IMAGE" =~ :migrations-([0-9a-f]{7})-[0-9]+$ ]]; then
            echo "::error::Cannot tell which commit the migration runner image was built from: $IMAGE"
            exit 1
          fi
          IMAGE_SHA="${BASH_REMATCH[1]}"
          if ! git merge-base --is-ancestor "$IMAGE_SHA" HEAD 2>/dev/null; then
            echo "::error::The migration runner image was built from $IMAGE_SHA, which is not on main"
            exit 1
          fi

          if [[ "$ACTION" == "list" ]]; then
            COMMAND=$(jq -nc '["node","dist/platform-roles.js","list"]')
          else
            COMMAND=$(jq -nc --arg a "$ACTION" --arg r "$ROLE" --arg t "$TARGET" --arg u "$ACTOR" \
              '["node","dist/platform-roles.js",$a,"--role",$r,"--target",$t,"--actor",$u]')
          fi
          OVERRIDES=$(jq -nc \
            --arg c "$CONTAINER_NAME" --argjson cmd "$COMMAND" \
            --arg actor "$GITHUB_ACTOR" --arg triggering "$TRIGGERING_ACTOR" \
            --arg run "$GITHUB_RUN" --arg attempt "$RUN_ATTEMPT" \
            '{containerOverrides:[{name:$c,command:$cmd,environment:[
              {name:"PLATFORM_ROLE_GITHUB_ACTOR",value:$actor},
              {name:"PLATFORM_ROLE_GITHUB_TRIGGERING_ACTOR",value:$triggering},
              {name:"PLATFORM_ROLE_GITHUB_RUN_ID",value:$run},
              {name:"PLATFORM_ROLE_GITHUB_RUN_ATTEMPT",value:$attempt}]}]}')

          if [[ "$SUBNETS" =~ ^\[.*\]$ ]]; then
            SUBNET_JSON="$SUBNETS"
          else
            SUBNET_JSON=$(jq -nc --arg s "$SUBNETS" '$s | split(",")')
          fi
          NETWORK=$(jq -nc --argjson s "$SUBNET_JSON" --arg g "$SECURITY_GROUP_ID" \
            '{awsvpcConfiguration:{subnets:$s,securityGroups:[$g],assignPublicIp:"DISABLED"}}')

          TASK_ARN=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER_NAME" \
            --task-definition "$TASK_DEF" \
            --launch-type FARGATE \
            --count 1 \
            --network-configuration "$NETWORK" \
            --overrides "$OVERRIDES" \
            --query 'tasks[0].taskArn' --output text)
          if [[ -z "$TASK_ARN" || "$TASK_ARN" == "None" ]]; then
            echo "::error::Failed to start the task"
            exit 1
          fi

          if ! timeout 900 aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER_NAME" --tasks "$TASK_ARN"; then
            STATUS=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER_NAME" --tasks "$TASK_ARN" \
              --query 'tasks[0].lastStatus' --output text)
            echo "::error::Task ${TASK_ARN##*/} is still $STATUS and may yet change the role; read its log before retrying"
            exit 1
          fi
          EXIT_CODE=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER_NAME" --tasks "$TASK_ARN" \
            --query "tasks[0].containers[?name=='$CONTAINER_NAME'].exitCode | [0]" --output text)

          LOG_GROUP=$(jq -r --arg c "$CONTAINER_NAME" '.containerDefinitions[] | select(.name==$c) | .logConfiguration.options["awslogs-group"]' task-definition.json)
          LOG_PREFIX=$(jq -r --arg c "$CONTAINER_NAME" '.containerDefinitions[] | select(.name==$c) | .logConfiguration.options["awslogs-stream-prefix"]' task-definition.json)
          {
            echo "### Platform role ${ACTION} on ${ENVIRONMENT}"
            echo "Exit code: \`${EXIT_CODE}\`"
            echo "Output: CloudWatch \`${LOG_GROUP}\`, stream \`${LOG_PREFIX}/${CONTAINER_NAME}/${TASK_ARN##*/}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          case "$EXIT_CODE" in
            0) echo "Done." ;;
            2) echo "::error::The command refused the request; its reason is in the task log"; exit 1 ;;
            *) echo "::error::The command failed with exit code $EXIT_CODE"; exit 1 ;;
          esac
