# Grafana Service Account Token Rotation Workflow
# Runs every ~15 days to rotate the Viewer token prod-plan's pull request plans read. Deploys and
# the dev pull request plan create their own token for each run instead.

name: Rotate Grafana Token

on:
  schedule:
    # Run on the 1st and 15th of every month at 00:00 UTC (every ~15 days)
    - cron: "0 0 1,15 * *"
  workflow_dispatch: # Allow manual trigger

permissions:
  id-token: write
  contents: read

jobs:
  rotate-token:
    name: Rotate Grafana Token - ${{ matrix.secret_environment }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Viewer account behind prod-plan's read-only pull request plans.
          - environment: prod
            secret_environment: prod-plan
            service_account_name: tofu-plan
    environment: ${{ matrix.environment }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set Grafana workspace ID (prod)
        if: matrix.environment == 'prod'
        run: |
          echo "::add-mask::${{ secrets.GRAFANA_WORKSPACE_ID_PROD }}"
          echo "WORKSPACE_ID=${{ secrets.GRAFANA_WORKSPACE_ID_PROD }}" >> $GITHUB_ENV

      - name: Use the named service account
        if: matrix.service_account_name != ''
        env:
          ACCOUNT_NAME: ${{ matrix.service_account_name }}
        run: |
          ACCOUNT_ID=$(aws grafana list-workspace-service-accounts \
            --workspace-id "$WORKSPACE_ID" \
            --region ${{ secrets.AWS_REGION }} \
            --query "serviceAccounts[?name=='$ACCOUNT_NAME'].id | [0]" \
            --output text)

          if [ -z "$ACCOUNT_ID" ] || [ "$ACCOUNT_ID" = "None" ]; then
            echo "::error::No service account named $ACCOUNT_NAME in the workspace"
            exit 1
          fi

          echo "::add-mask::$ACCOUNT_ID"
          echo "SERVICE_ACCOUNT_ID=$ACCOUNT_ID" >> $GITHUB_ENV

      - name: Create New Token
        id: create-token
        run: |
          echo "✅ Using configured Grafana workspace and service account for environment: ${{ matrix.environment }}"

          # Create new token (30 days = 2592000 seconds)
          TOKEN_OUTPUT=$(aws grafana create-workspace-service-account-token \
            --name "github-actions-$(date +%Y%m%d-%H%M%S)" \
            --workspace-id "$WORKSPACE_ID" \
            --service-account-id "$SERVICE_ACCOUNT_ID" \
            --seconds-to-live 2592000 \
            --region ${{ secrets.AWS_REGION }})

          # Extract token details
          TOKEN_ID=$(echo "$TOKEN_OUTPUT" | jq -r '.serviceAccountToken.id')
          TOKEN_VALUE=$(echo "$TOKEN_OUTPUT" | jq -r '.serviceAccountToken.key')
          echo "::add-mask::$TOKEN_VALUE"
          TOKEN_NAME=$(echo "$TOKEN_OUTPUT" | jq -r '.serviceAccountToken.name')

          # Calculate dates (30 days = 2592000 seconds)
          CREATED_AT=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          EXPIRES_AT=$(date -u -d '+30 days' '+%Y-%m-%d %H:%M:%S UTC' 2>/dev/null || date -u -v+30d '+%Y-%m-%d %H:%M:%S UTC')

          echo "token_id=$TOKEN_ID" >> $GITHUB_OUTPUT
          echo "token_name=$TOKEN_NAME" >> $GITHUB_OUTPUT
          echo "created_at=$CREATED_AT" >> $GITHUB_OUTPUT
          echo "expires_at=$EXPIRES_AT" >> $GITHUB_OUTPUT

          # Store token value securely for next step
          echo "TOKEN_VALUE=$TOKEN_VALUE" >> $GITHUB_ENV

          echo "✅ Created new token: $TOKEN_NAME"
          echo "   Token ID: $TOKEN_ID"
          echo "   Created: $CREATED_AT"
          echo "   Expires: $EXPIRES_AT"

      - name: Update GitHub Secret
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          # Update GitHub environment secret
          echo "$TOKEN_VALUE" | gh secret set "GRAFANA_SERVICE_TOKEN" \
            --repo ${{ github.repository }} \
            --env ${{ matrix.secret_environment }}

          echo "✅ Updated GitHub Secret: GRAFANA_SERVICE_TOKEN in environment: ${{ matrix.secret_environment }}"
          echo "   Token will be available as: secrets.GRAFANA_SERVICE_TOKEN"

      - name: List and Revoke Old Tokens
        run: |
          NEW_TOKEN_ID="${{ steps.create-token.outputs.token_id }}"

          # List all tokens for this service account
          TOKENS=$(aws grafana list-workspace-service-account-tokens \
            --workspace-id "$WORKSPACE_ID" \
            --service-account-id "$SERVICE_ACCOUNT_ID" \
            --region ${{ secrets.AWS_REGION }})

          # Extract token IDs (excluding the new token)
          OLD_TOKEN_IDS=$(echo "$TOKENS" | jq -r \
            --arg new_id "$NEW_TOKEN_ID" \
            '.serviceAccountTokens[] | select(.id != $new_id) | .id')

          if [ -z "$OLD_TOKEN_IDS" ]; then
            echo "ℹ️  No old tokens to revoke"
          else
            echo "🗑️  Revoking old tokens..."
            for TOKEN_ID in $OLD_TOKEN_IDS; do
              aws grafana delete-workspace-service-account-token \
                --workspace-id "$WORKSPACE_ID" \
                --service-account-id "$SERVICE_ACCOUNT_ID" \
                --token-id "$TOKEN_ID" \
                --region ${{ secrets.AWS_REGION }}
              echo "   ✅ Revoked token: $TOKEN_ID"
            done
          fi

      - name: Verify Token Rotation
        run: |
          echo "✅ Token rotation completed successfully!"
          echo ""
          echo "📋 Rotation Summary:"
          echo "   Environment: ${{ matrix.environment }}"
          echo "   Token Name: ${{ steps.create-token.outputs.token_name }}"
          echo "   Token ID: ${{ steps.create-token.outputs.token_id }}"
          echo "   Created: ${{ steps.create-token.outputs.created_at }}"
          echo "   Expires: ${{ steps.create-token.outputs.expires_at }}"
          echo "   GitHub Secret: GRAFANA_SERVICE_TOKEN (environment: ${{ matrix.secret_environment }})"
          echo ""
          echo "✨ Next rotation scheduled: ~15 days (1st or 15th of month)"

      - name: Notify on Failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TARGET: ${{ matrix.secret_environment }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo "❌ Grafana token rotation failed for environment: $TARGET"
          echo ""
          echo "Workflow: ${{ github.workflow }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "Run URL: $RUN_URL"
          echo ""
          echo "Please investigate the logs above and rotate the token manually if needed."

          # A token lives 30 days and rotates every 15, so one failure leaves about two weeks.
          TEXT=":warning: Grafana token rotation failed for \`$TARGET\`. The current token expires within 30 days of its last rotation, and OpenTofu runs fail on Grafana after that. Re-run or fix: $RUN_URL"
          jq -n --arg text "$TEXT" '{text: $text}' \
            | curl -fsS -X POST -H 'Content-Type: application/json' --data @- "$SLACK_WEBHOOK_URL" \
            || echo "::warning::Could not post the failure to Slack"

          exit 1
