name: Web E2E

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DO_NOT_TRACK: 1
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-nodejs-pnpm
        with:
          node-version: "24"

      - name: Install Chromium
        run: pnpm --filter @repo/e2e exec playwright install --with-deps chromium

      - name: Prepare Local Environment
        run: |
          cp apps/backend/.env.example apps/backend/.env
          cp apps/web/.env.example apps/web/.env.local
          pnpm db:setup
          pnpm --filter database db:seed

      - name: Build Applications
        run: |
          pnpm --filter backend build
          pnpm --filter web build
          # Next standalone copies neither static build assets nor public files.
          cp -R apps/web/.next/static apps/web/.next/standalone/apps/web/.next/static
          cp -R apps/web/public apps/web/.next/standalone/apps/web/public

      # Production output removes per-route compilation from Playwright timing.
      - name: Start Applications
        run: |
          NODE_ENV=production pnpm --filter backend start:prod > /tmp/openjii-backend.log 2>&1 &
          HOSTNAME=127.0.0.1 PORT=3000 node apps/web/.next/standalone/apps/web/server.js > /tmp/openjii-web.log 2>&1 &

      - name: Wait for Applications
        run: |
          for url in http://127.0.0.1:3020/health http://127.0.0.1:3000; do
            for attempt in {1..60}; do
              if curl --fail --silent "$url" > /dev/null; then break; fi
              if [ "$attempt" -eq 60 ]; then
                echo "::error::Timed out waiting for $url"
                exit 1
              fi
              sleep 1
            done
          done

      - name: Run Playwright
        run: pnpm e2e

      - name: Upload Playwright Failure Artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: web-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/e2e/playwright-report/
            apps/e2e/test-results/
            /tmp/openjii-backend.log
            /tmp/openjii-web.log
          if-no-files-found: warn
          retention-days: 7
