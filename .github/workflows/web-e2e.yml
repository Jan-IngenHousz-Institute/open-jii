name: Web E2E

on:
  pull_request:
    paths:
      - ".github/actions/setup-nodejs-pnpm/**"
      - ".github/workflows/web-e2e.yml"
      - "apps/backend/**"
      - "apps/e2e/**"
      - "apps/web/**"
      - "packages/**"
      - "tooling/devkit/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "turbo.json"
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

concurrency:
  group: web-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DO_NOT_TRACK: 1
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-nodejs-pnpm
        with:
          node-version: "24"

      - name: Install Chromium
        run: pnpm --filter @repo/e2e exec playwright install --with-deps chromium

      - name: Prepare Local Environment
        run: |
          cp apps/backend/.env.example apps/backend/.env
          cp apps/web/.env.example apps/web/.env.local
          pnpm db:setup
          pnpm --filter database db:seed

      - name: Build Applications
        run: |
          pnpm exec turbo run build --filter=backend --filter=web
          # Next standalone copies neither static build assets nor public files.
          mkdir -p apps/web/.next/standalone/apps/web/.next/static
          mkdir -p apps/web/.next/standalone/apps/web/public
          cp -R apps/web/.next/static/. apps/web/.next/standalone/apps/web/.next/static/
          cp -R apps/web/public/. apps/web/.next/standalone/apps/web/public/

      # Playwright starts, probes, and stops both production servers.
      - name: Run Playwright
        run: pnpm e2e

      - name: Upload Playwright Failure Artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: web-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/e2e/playwright-report/
            apps/e2e/test-results/
            /tmp/openjii-backend.log
            /tmp/openjii-web.log
          if-no-files-found: warn
          retention-days: 7
