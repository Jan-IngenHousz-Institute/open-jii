# OpenTofu Workflow
# Infrastructure deployment and planning with OpenTofu

name: OpenTofu Workflow

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "The target environment. Prod infrastructure goes through the PROD Release workflow, which waits for an approval."
        required: true
        type: choice
        options:
          - dev
      ref:
        description: "Git ref (commit SHA, branch, or tag) to deploy - leave empty to deploy current branch latest commit"
        required: false
        type: string
        default: ""

  workflow_call:
    inputs:
      environment:
        description: "Target environment (dev, prod)"
        required: true
        type: string
      ref:
        description: "Git ref (commit SHA, branch, or tag) to deploy"
        required: false
        type: string
        default: ""

concurrency:
  group: opentofu-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  plan:
    name: OpenTofu Plan
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    env:
      environment: ${{ inputs.environment }}
      TF_VAR_databricks_account_id: ${{ secrets.DATABRICKS_ACCOUNT_ID }}
      TF_VAR_databricks_client_id: ${{ secrets.DATABRICKS_CLIENT_ID }}
      TF_VAR_databricks_auth_type: github-oidc
      TF_VAR_databricks_host: ${{ secrets.DATABRICKS_HOST }}
      TF_VAR_auth_secret: ${{ secrets.AUTH_SECRET }}
      TF_VAR_notification_unsubscribe_secret: ${{ secrets.NOTIFICATION_UNSUBSCRIBE_SECRET }}
      TF_VAR_github_oauth_client_id: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
      TF_VAR_github_oauth_client_secret: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
      TF_VAR_backend_webhook_api_key_id: ${{ secrets.BACKEND_WEBHOOK_API_KEY_ID }}
      TF_VAR_backend_webhook_api_key: ${{ secrets.BACKEND_WEBHOOK_API_KEY }}
      TF_VAR_backend_webhook_secret: ${{ secrets.BACKEND_WEBHOOK_SECRET }}
      TF_VAR_backend_databricks_warehouse_id: ${{ secrets.BACKEND_DATABRICKS_WAREHOUSE_ID }}
      TF_VAR_contentful_space_id: ${{ secrets.CONTENTFUL_SPACE_ID }}
      TF_VAR_contentful_access_token: ${{ secrets.CONTENTFUL_ACCESS_TOKEN }}
      TF_VAR_contentful_preview_access_token: ${{ secrets.CONTENTFUL_PREVIEW_ACCESS_TOKEN }}
      TF_VAR_contentful_preview_secret: ${{ secrets.CONTENTFUL_PREVIEW_SECRET }}
      TF_VAR_mailchimp_api_key: ${{ secrets.MAILCHIMP_API_KEY }}
      TF_VAR_mailchimp_server_prefix: ${{ secrets.MAILCHIMP_SERVER_PREFIX }}
      TF_VAR_mailchimp_audience_id: ${{ secrets.MAILCHIMP_AUDIENCE_ID }}
      TF_VAR_mailchimp_community_kind: ${{ secrets.MAILCHIMP_COMMUNITY_KIND }}
      TF_VAR_mailchimp_community_id: ${{ secrets.MAILCHIMP_COMMUNITY_ID }}
      TF_VAR_mailchimp_community_name: ${{ secrets.MAILCHIMP_COMMUNITY_NAME }}
      TF_VAR_api_cloudfront_header_value: ${{ secrets.API_CLOUDFRONT_HEADER_VALUE }}
      TF_VAR_orcid_oauth_client_id: ${{ secrets.ORCID_OAUTH_CLIENT_ID }}
      TF_VAR_orcid_oauth_client_secret: ${{ secrets.ORCID_OAUTH_CLIENT_SECRET }}
      TF_VAR_posthog_key: ${{ secrets.POSTHOG_KEY }}
      TF_VAR_slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
      TF_VAR_status_slack_webhook_url: ${{ secrets.STATUS_SLACK_WEBHOOK_URL }}
      TF_VAR_kinesis_credential_id: ${{ secrets.KINESIS_CREDENTIAL_ID }}
      TF_VAR_dev_nameservers: ${{ secrets.DEV_NAMESERVERS }}
      TF_VAR_posthog_tofu_api_key: ${{ secrets.POSTHOG_TOFU_API_KEY }}
      TF_VAR_posthog_grafana_api_key: ${{ secrets.POSTHOG_GRAFANA_API_KEY }}
    steps:
      - name: Validate environment
        env:
          TARGET_ENV: ${{ inputs.environment }}
        run: |
          case "$TARGET_ENV" in
            dev | prod) ;;
            *) echo "::error::Unknown environment '$TARGET_ENV'"; exit 1 ;;
          esac

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      # The apply checks out this commit, so a branch that moves between the jobs cannot hand it
      # a lock file the saved plan was not made with. It goes as an artifact rather than a job
      # output for the reason given at the plan's upload below.
      - name: Record the planned commit
        run: |
          mkdir -p "$RUNNER_TEMP/planned-commit"
          git rev-parse HEAD > "$RUNNER_TEMP/planned-commit/sha"

      - name: Upload the planned commit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tofu-planned-commit-${{ inputs.environment }}
          path: ${{ runner.temp }}/planned-commit/sha
          retention-days: 7

      - name: Setup OpenTofu and AWS Credentials
        uses: ./.github/actions/tofu/tofu-setup
        with:
          aws_role_arn: ${{ secrets.AWS_ROLE_ARN }}
          aws_region: ${{ secrets.AWS_REGION }}

      - name: OpenTofu Format Check
        uses: ./.github/actions/tofu/tofu-fmt-check

      - name: Trivy IaC Misconfiguration Scan
        uses: ./.github/actions/tofu/tofu-scan

      - name: OpenTofu Init and Validate
        uses: ./.github/actions/tofu/tofu-init-validate

      - name: Create a Grafana token for this run
        id: grafana
        uses: ./.github/actions/tofu/grafana-token
        with:
          workspace_id: ${{ inputs.environment == 'prod' && secrets.GRAFANA_WORKSPACE_ID_PROD || secrets.GRAFANA_WORKSPACE_ID_DEV }}
          service_account_id: ${{ inputs.environment == 'prod' && vars.GRAFANA_SERVICE_ACCOUNT_ID_PROD || vars.GRAFANA_SERVICE_ACCOUNT_ID_DEV }}

      - name: OpenTofu Plan
        uses: ./.github/actions/tofu/tofu-plan
        env:
          TF_VAR_grafana_auth_service_token: ${{ steps.grafana.outputs.token }}
        with:
          out: ${{ runner.temp }}/tfplan

      # The saved plan holds the configuration's secret values, as the state does, so it is kept
      # beside the state and never as a workflow artifact. Both jobs derive the key from the run
      # ID: GitHub drops a job output that contains any secret's value, and a one-character secret
      # matches most run IDs.
      - name: Save the plan for the apply
        env:
          TARGET_ENV: ${{ inputs.environment }}
        run: |
          KEY="plans/${GITHUB_RUN_ID}"
          BUCKET="s3://open-jii-terraform-state-${TARGET_ENV}"
          aws s3 cp "$RUNNER_TEMP/tfplan" "${BUCKET}/${KEY}.tfplan" --only-show-errors

      - name: Delete the Grafana token
        if: always() && steps.grafana.outputs.token_id != ''
        uses: ./.github/actions/tofu/grafana-token-delete
        with:
          workspace_id: ${{ inputs.environment == 'prod' && secrets.GRAFANA_WORKSPACE_ID_PROD || secrets.GRAFANA_WORKSPACE_ID_DEV }}
          service_account_id: ${{ inputs.environment == 'prod' && vars.GRAFANA_SERVICE_ACCOUNT_ID_PROD || vars.GRAFANA_SERVICE_ACCOUNT_ID_DEV }}
          token_id: ${{ steps.grafana.outputs.token_id }}

  approval_gate:
    name: Approval Gate
    needs: plan
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment == 'prod' && 'prod-approval' || 'approval-gate' }}
    permissions:
      contents: read
    steps:
      - name: Await Approval for Apply
        run: |
          echo "Approved deployment for ${{ inputs.environment }} environment."

  apply:
    name: OpenTofu Apply
    needs: [plan, approval_gate]
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      needs.approval_gate.result == 'success'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    env:
      environment: ${{ inputs.environment }}
      TF_VAR_databricks_account_id: ${{ secrets.DATABRICKS_ACCOUNT_ID }}
      TF_VAR_databricks_client_id: ${{ secrets.DATABRICKS_CLIENT_ID }}
      TF_VAR_databricks_auth_type: github-oidc
      TF_VAR_databricks_host: ${{ secrets.DATABRICKS_HOST }}
      TF_VAR_auth_secret: ${{ secrets.AUTH_SECRET }}
      TF_VAR_notification_unsubscribe_secret: ${{ secrets.NOTIFICATION_UNSUBSCRIBE_SECRET }}
      TF_VAR_github_oauth_client_id: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
      TF_VAR_github_oauth_client_secret: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
      TF_VAR_backend_webhook_api_key_id: ${{ secrets.BACKEND_WEBHOOK_API_KEY_ID }}
      TF_VAR_backend_webhook_api_key: ${{ secrets.BACKEND_WEBHOOK_API_KEY }}
      TF_VAR_backend_webhook_secret: ${{ secrets.BACKEND_WEBHOOK_SECRET }}
      TF_VAR_backend_databricks_warehouse_id: ${{ secrets.BACKEND_DATABRICKS_WAREHOUSE_ID }}
      TF_VAR_contentful_space_id: ${{ secrets.CONTENTFUL_SPACE_ID }}
      TF_VAR_contentful_access_token: ${{ secrets.CONTENTFUL_ACCESS_TOKEN }}
      TF_VAR_contentful_preview_access_token: ${{ secrets.CONTENTFUL_PREVIEW_ACCESS_TOKEN }}
      TF_VAR_contentful_preview_secret: ${{ secrets.CONTENTFUL_PREVIEW_SECRET }}
      TF_VAR_mailchimp_api_key: ${{ secrets.MAILCHIMP_API_KEY }}
      TF_VAR_mailchimp_server_prefix: ${{ secrets.MAILCHIMP_SERVER_PREFIX }}
      TF_VAR_mailchimp_audience_id: ${{ secrets.MAILCHIMP_AUDIENCE_ID }}
      TF_VAR_mailchimp_community_kind: ${{ secrets.MAILCHIMP_COMMUNITY_KIND }}
      TF_VAR_mailchimp_community_id: ${{ secrets.MAILCHIMP_COMMUNITY_ID }}
      TF_VAR_mailchimp_community_name: ${{ secrets.MAILCHIMP_COMMUNITY_NAME }}
      TF_VAR_api_cloudfront_header_value: ${{ secrets.API_CLOUDFRONT_HEADER_VALUE }}
      TF_VAR_orcid_oauth_client_id: ${{ secrets.ORCID_OAUTH_CLIENT_ID }}
      TF_VAR_orcid_oauth_client_secret: ${{ secrets.ORCID_OAUTH_CLIENT_SECRET }}
      TF_VAR_posthog_key: ${{ secrets.POSTHOG_KEY }}
      TF_VAR_slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
      TF_VAR_status_slack_webhook_url: ${{ secrets.STATUS_SLACK_WEBHOOK_URL }}
      TF_VAR_kinesis_credential_id: ${{ secrets.KINESIS_CREDENTIAL_ID }}
      TF_VAR_dev_nameservers: ${{ secrets.DEV_NAMESERVERS }}
      TF_VAR_posthog_tofu_api_key: ${{ secrets.POSTHOG_TOFU_API_KEY }}
      TF_VAR_posthog_grafana_api_key: ${{ secrets.POSTHOG_GRAFANA_API_KEY }}
    steps:
      - name: Download the planned commit
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tofu-planned-commit-${{ inputs.environment }}
          path: ${{ runner.temp }}/planned-commit

      - name: Read the planned commit
        id: planned
        run: |
          SHA=$(cat "$RUNNER_TEMP/planned-commit/sha")
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The planned commit '$SHA' is not a commit SHA."
            exit 1
          fi
          echo "Applying the plan made at ${SHA:0:7}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.planned.outputs.sha }}
          persist-credentials: false

      - name: Setup OpenTofu and AWS Credentials
        uses: ./.github/actions/tofu/tofu-setup
        with:
          aws_role_arn: ${{ secrets.AWS_ROLE_ARN }}
          aws_region: ${{ secrets.AWS_REGION }}

      - name: Fetch the approved plan
        env:
          TARGET_ENV: ${{ inputs.environment }}
        run: |
          KEY="plans/${GITHUB_RUN_ID}"
          BUCKET="s3://open-jii-terraform-state-${TARGET_ENV}"
          aws s3 cp "${BUCKET}/${KEY}.tfplan" "$RUNNER_TEMP/tfplan" --only-show-errors

      - name: OpenTofu Init and Validate
        uses: ./.github/actions/tofu/tofu-init-validate

      - name: Create a Grafana token for this run
        id: grafana
        uses: ./.github/actions/tofu/grafana-token
        with:
          workspace_id: ${{ inputs.environment == 'prod' && secrets.GRAFANA_WORKSPACE_ID_PROD || secrets.GRAFANA_WORKSPACE_ID_DEV }}
          service_account_id: ${{ inputs.environment == 'prod' && vars.GRAFANA_SERVICE_ACCOUNT_ID_PROD || vars.GRAFANA_SERVICE_ACCOUNT_ID_DEV }}
          seconds_to_live: "7200"

      - name: OpenTofu Apply
        uses: ./.github/actions/tofu/tofu-apply
        env:
          TF_VAR_grafana_auth_service_token: ${{ steps.grafana.outputs.token }}
        with:
          plan_file: ${{ runner.temp }}/tfplan

      - name: Delete the Grafana token
        if: always() && steps.grafana.outputs.token_id != ''
        uses: ./.github/actions/tofu/grafana-token-delete
        with:
          workspace_id: ${{ inputs.environment == 'prod' && secrets.GRAFANA_WORKSPACE_ID_PROD || secrets.GRAFANA_WORKSPACE_ID_DEV }}
          service_account_id: ${{ inputs.environment == 'prod' && vars.GRAFANA_SERVICE_ACCOUNT_ID_PROD || vars.GRAFANA_SERVICE_ACCOUNT_ID_DEV }}
          token_id: ${{ steps.grafana.outputs.token_id }}
