name: Linear ref check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  pull-requests: read

concurrency:
  group: linear-ref-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  linear-ref:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const title = pr.title || "";
            const body = pr.body || "";
            const author = (pr.user?.login || "").toLowerCase();
            const labels = (pr.labels || []).map(l => l.name.toLowerCase());

            const isBot = author.endsWith("[bot]")
              || ["dependabot", "renovate", "github-actions"].some(b => author.includes(b));
            if (isBot) {
              core.info("Bot-authored PR; metadata check is exempt.");
              return;
            }

            const conventionalTitle = /^(feat|fix|perf|revert|docs|style|chore|refactor|test|build|ci)(\([^)\r\n]+\))?!?:\s+\S/i;
            if (!conventionalTitle.test(title)) {
              core.setFailed([
                "PR title is not a valid Conventional Commit.",
                "",
                "Use: <type>(<optional-scope>): <description> (OJD-####)",
                "Example: feat(web): add filters shelf (OJD-1541)",
                "",
                "Allowed types: feat, fix, perf, revert, docs, style, chore, refactor, test, build, ci.",
              ].join("\n"));
              return;
            }

            const optedOut = labels.includes("no-linear") || labels.includes("dependencies");
            const isDepOrBump = /^(chore|build|fix)\(deps\)/i.test(title) || /\bbump\b/i.test(title);

            if (optedOut || isDepOrBump) {
              core.info(`Linear metadata is exempt (label=${optedOut}, depBump=${isDepOrBump}).`);
              return;
            }

            const titleIssues = [...title.matchAll(/\bOJD-\d+\b/gi)].map(match => match[0].toUpperCase());
            const relationPattern = /^\s*(?:[-*]\s*)?(?:close(?:s|d|ing)?|fix(?:es|ed|ing)?|resolve(?:s|d|ing)?|complete(?:s|d|ing)?|implement(?:s|ed|ing)?|ref|references?|part of|related to|contributes? to|towards)\s+(OJD-\d+)\b/gim;
            const bodyIssues = [...body.matchAll(relationPattern)].map(match => match[1].toUpperCase());

            const errors = [];
            if (titleIssues.length === 0) {
              errors.push("Add the primary Linear issue to the PR title, e.g. `(OJD-1541)`.");
            }
            if (bodyIssues.length === 0) {
              errors.push("Add a Linear relation line to the PR body, e.g. `Closes OJD-1541` or `Contributes to OJD-1541`.");
            }

            const bodyIssueSet = new Set(bodyIssues);
            const unlinkedTitleIssues = titleIssues.filter(issue => !bodyIssueSet.has(issue));
            if (unlinkedTitleIssues.length > 0) {
              errors.push(`Add a body relation line for: ${[...new Set(unlinkedTitleIssues)].join(", ")}.`);
            }

            if (errors.length > 0) {
              core.setFailed([
                "PR metadata is incomplete for Linear release tracking:",
                ...errors.map(error => `- ${error}`),
                "",
                "If this PR genuinely has no Linear issue, add the `no-linear` label and explain why in Additional Notes.",
              ].join("\n"));
              return;
            }

            core.info(`Release metadata valid: ${[...new Set([...titleIssues, ...bodyIssues])].join(", ")}`);
