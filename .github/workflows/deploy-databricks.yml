name: Databricks Deployment Workflow

on:
  workflow_call:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        type: string
      ref:
        description: "Git ref (commit SHA, branch, or tag) to deploy - leave empty to deploy current branch latest commit"
        required: false
        type: string
        default: ""

env:
  ENV: ${{ inputs.environment }}

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy Databricks Bundle
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Validate environment
        env:
          TARGET_ENV: ${{ inputs.environment }}
        run: |
          case "$TARGET_ENV" in
            dev | prod) ;;
            *) echo "::error::Unknown environment '$TARGET_ENV'"; exit 1 ;;
          esac

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Get Checked Out SHA
        id: get-sha
        run: |
          ACTUAL_SHA=$(git rev-parse HEAD)
          echo "sha=$ACTUAL_SHA" >> $GITHUB_OUTPUT
          echo "Checked out SHA: $ACTUAL_SHA"

      - name: Capture Deployment Start Time
        uses: ./.github/actions/capture-dora-start

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Install Python build tool
        run: pip install --upgrade pip build

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@9230f12203ef173d0b901846f62a55ce997efef7 # v1.19.0

      - name: Validate bundle
        working-directory: apps/data
        run: |
          echo "Validating bundle for ${{ inputs.environment }} environment..."
          databricks bundle validate -t ${{ inputs.environment }}
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_GHA_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_GHA_CLIENT_SECRET }}

      - name: Plan bundle deployment
        working-directory: apps/data
        run: |
          echo "Planning bundle deployment to ${{ inputs.environment }} environment..."
          databricks bundle plan -t ${{ inputs.environment }}
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_GHA_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_GHA_CLIENT_SECRET }}

      - name: Deploy bundle
        id: deploy-bundle
        working-directory: apps/data
        run: |
          echo "Deploying bundle to ${{ inputs.environment }} environment..."
          databricks bundle deploy -t ${{ inputs.environment }}
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_GHA_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_GHA_CLIENT_SECRET }}

      - name: Publish DORA Metrics
        if: always()
        uses: ./.github/actions/publish-dora-metrics
        with:
          deployment-outcome: ${{ steps.deploy-bundle.outcome || 'failure' }}
          service: "databricks"
          environment: ${{ env.ENV }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Show deployment summary
        working-directory: apps/data
        run: |
          echo "Fetching bundle deployment summary..."
          databricks bundle summary -t ${{ inputs.environment }}
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_GHA_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_GHA_CLIENT_SECRET }}
