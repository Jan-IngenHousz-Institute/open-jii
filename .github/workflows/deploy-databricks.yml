name: Databricks Deployment Workflow

on:
  workflow_call:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        type: string
      ref:
        description: "Git ref (commit SHA, branch, or tag) to deploy - leave empty to deploy current branch latest commit"
        required: false
        type: string
        default: ""

env:
  ENV: ${{ inputs.environment }}

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy Databricks Bundle
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Validate environment
        env:
          TARGET_ENV: ${{ inputs.environment }}
        run: |
          case "$TARGET_ENV" in
            dev | prod) ;;
            *) echo "::error::Unknown environment '$TARGET_ENV'"; exit 1 ;;
          esac

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Get Checked Out SHA
        id: get-sha
        run: |
          ACTUAL_SHA=$(git rev-parse HEAD)
          echo "sha=$ACTUAL_SHA" >> $GITHUB_OUTPUT
          echo "Checked out SHA: $ACTUAL_SHA"

      - name: Capture Deployment Start Time
        uses: ./.github/actions/capture-dora-start

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"

      - name: Install Python build tool
        run: pip install --upgrade pip build

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@9625fdde9ba2607df0087e0d3ec7449198bf2180 # v1.23.0

      - name: Validate bundle
        working-directory: apps/data
        run: |
          echo "Validating bundle for ${{ inputs.environment }} environment..."
          databricks bundle validate -t ${{ inputs.environment }}
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_GHA_CLIENT_ID }}
          DATABRICKS_AUTH_TYPE: github-oidc
          DATABRICKS_TOKEN_AUDIENCE: ${{ secrets.DATABRICKS_ACCOUNT_ID }}

      # The deploy applies this saved plan, so what passes the checks is what changes.
      - name: Plan bundle deployment
        working-directory: apps/data
        run: |
          PLAN="$RUNNER_TEMP/bundle-plan.json"
          databricks bundle plan -t "$TARGET_ENV" -o json > "$PLAN"
          # An empty or malformed file would pass every check below.
          jq -e '.plan_version' "$PLAN" > /dev/null
          jq -r '(.plan // {}) | to_entries[] | "\(.value.action)\t\(.key)"' "$PLAN" | sort

          # The CLI asks before deleting or recreating a pipeline, but never before a job.
          DESTRUCTIVE=$(jq -r '
            (.plan // {}) | to_entries[]
            | select(.value.action == "delete" or .value.action == "recreate")
            | select((.value.state_only or .value.gone) | not)
            | select(.key | test("^resources\\.(pipelines|jobs)\\.[^.]+(\\.permissions)?$"))
            | .key' "$PLAN")
          if [ -n "$DESTRUCTIVE" ]; then
            echo "::error::The plan deletes or recreates: $(echo $DESTRUCTIVE)"
            exit 1
          fi

          # Creating a pipeline or job whose name is already taken means a live one was never bound.
          CREATES=$(jq -r '
            (.plan // {}) | to_entries[]
            | select(.value.action == "create")
            | select(.key | test("^resources\\.(pipelines|jobs)\\.[^.]+$"))
            | "\(.key)\t\(.value.new_state.value.name // "")"' "$PLAN")
          DUPLICATES=""
          while IFS=$'\t' read -r KEY NAME; do
            [ -n "$KEY" ] || continue
            if [ -z "$NAME" ]; then
              echo "::error::The plan creates $KEY without a name to check"
              exit 1
            fi
            case "$KEY" in
              resources.pipelines.*) FOUND=$(databricks pipelines list-pipelines --filter "name LIKE '$NAME'" -o json | jq length) ;;
              resources.jobs.*) FOUND=$(databricks jobs list --name "$NAME" -o json | jq length) ;;
            esac
            if [ "$FOUND" -gt 0 ]; then
              DUPLICATES="$DUPLICATES $KEY"
            fi
          done <<< "$CREATES"
          if [ -n "$DUPLICATES" ]; then
            echo "::error::The plan creates resources whose names already exist:$DUPLICATES"
            exit 1
          fi
        env:
          TARGET_ENV: ${{ inputs.environment }}
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_GHA_CLIENT_ID }}
          DATABRICKS_AUTH_TYPE: github-oidc
          DATABRICKS_TOKEN_AUDIENCE: ${{ secrets.DATABRICKS_ACCOUNT_ID }}

      - name: Deploy bundle
        id: deploy-bundle
        working-directory: apps/data
        run: databricks bundle deploy -t "$TARGET_ENV" --plan "$RUNNER_TEMP/bundle-plan.json"
        env:
          TARGET_ENV: ${{ inputs.environment }}
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_GHA_CLIENT_ID }}
          DATABRICKS_AUTH_TYPE: github-oidc
          DATABRICKS_TOKEN_AUDIENCE: ${{ secrets.DATABRICKS_ACCOUNT_ID }}

      - name: Publish DORA Metrics
        if: always()
        uses: ./.github/actions/publish-dora-metrics
        with:
          deployment-outcome: ${{ steps.deploy-bundle.outcome || 'failure' }}
          service: "databricks"
          environment: ${{ env.ENV }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Show deployment summary
        working-directory: apps/data
        run: |
          echo "Fetching bundle deployment summary..."
          databricks bundle summary -t ${{ inputs.environment }}
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_GHA_CLIENT_ID }}
          DATABRICKS_AUTH_TYPE: github-oidc
          DATABRICKS_TOKEN_AUDIENCE: ${{ secrets.DATABRICKS_ACCOUNT_ID }}
