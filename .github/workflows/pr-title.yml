name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

# A re-run gets a group of its own, so re-running an older title check cannot cancel the newest.
concurrency:
  group: pr-title-${{ github.event.pull_request.number }}${{ github.run_attempt != '1' && format('-attempt-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  validate_pr:
    # The main ruleset requires this check by name.
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@c5e23b7e584519ee15caa684cf60d056aa9f035f # v6.1.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
