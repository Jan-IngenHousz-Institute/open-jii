# Backend Deployment Workflow
# Builds Docker image and deploys to ECS

name: Backend Deployment Workflow

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "The deployment environment (dev, prod)"
        required: true
        type: choice
        options:
          - dev
          - prod
      ref:
        description: "Git ref (commit SHA, branch, or tag) to deploy - leave empty to deploy current branch latest commit"
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      environment:
        description: "The deployment environment (dev, prod)"
        required: true
        type: string
      ref:
        description: "Git ref (commit SHA, branch, or tag) to deploy - leave empty to deploy current branch latest commit"
        required: false
        type: string
        default: ""

env:
  ENV: ${{ inputs.environment }}
  ECR_REPOSITORY: open-jii-backend

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    name: Build and Deploy Backend
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Validate environment
        env:
          TARGET_ENV: ${{ inputs.environment }}
        run: |
          case "$TARGET_ENV" in
            dev | prod) ;;
            *) echo "::error::Unknown environment '$TARGET_ENV'"; exit 1 ;;
          esac

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Get Checked Out SHA
        id: get-sha
        run: |
          ACTUAL_SHA=$(git rev-parse HEAD)
          echo "sha=$ACTUAL_SHA" >> $GITHUB_OUTPUT
          echo "Checked out SHA: $ACTUAL_SHA"

      - name: Capture Deployment Start Time
        uses: ./.github/actions/capture-dora-start

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-nodejs-pnpm
        with:
          node-version: "24"
          hoisted: "false"

      - name: Check Docker
        run: |
          echo "🔍 Checking Docker..."

          # Check if Docker is installed and running
          if ! docker info &> /dev/null; then
            echo "::error::Docker is not running or not available"
            exit 1
          fi

          echo "🚀 Deploying backend to ${{ env.ENV }} environment in ${{ secrets.AWS_REGION }}"
          echo "📦 Using image tag: ${{ steps.get-sha.outputs.sha }}"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Get Infrastructure Configuration
        uses: ./.github/actions/get-infrastructure-config
        with:
          environment: ${{ inputs.environment }}
          prefix: "/backend"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Set environment variables
        run: |
          # Set registry and image tag
          echo "ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}" >> $GITHUB_ENV
          echo "IMAGE_TAG=${{ steps.get-sha.outputs.sha }}" >> $GITHUB_ENV

      - name: Build Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.get-sha.outputs.sha }}
          DOCKER_FILE_PATH: apps/backend/Dockerfile
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -f $DOCKER_FILE_PATH --platform linux/amd64 --build-arg PROJECT=backend .
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.build-image.outputs.image }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          vuln-type: os,library
          ignore-unfixed: true
          trivyignores: .trivyignore.docker-images.yaml

      - name: Push image to Amazon ECR
        run: docker push ${{ steps.build-image.outputs.image }}

      - name: Resolve task definition JSON from ARN
        run: |
          set -euo pipefail
          if [[ -z "${TASK_DEFINITION_ARN:-}" ]]; then
            echo "::error::TASK_DEFINITION_ARN is not set. Ensure SSM parameter /backend/${{ env.ENV }}/ecs/task-definition-arn is present and loaded by 'Get Infrastructure Configuration'."
            exit 1
          fi

          echo "Fetching task definition JSON for ARN: ${TASK_DEFINITION_ARN}"
          aws ecs describe-task-definition \
            --task-definition "${TASK_DEFINITION_ARN}" \
            --query taskDefinition > task-definition.json

          echo "ECS_TASK_DEFINITION=task-definition.json" >> "$GITHUB_ENV"

      - name: Capture current service task definition
        id: prev-task-def
        run: |
          set -euo pipefail
          PREV=$(aws ecs describe-services \
            --cluster "backend-cluster-${{ env.ENV }}" \
            --services "backend-${{ env.ENV }}" \
            --query "services[0].taskDefinition" \
            --output text 2>/dev/null || echo "")

          if [[ -z "$PREV" || "$PREV" == "None" ]]; then
            echo "::warning::Previous task definition not found; rollback will be skipped"
          else
            echo "PREV_TASK_DEFINITION_ARN=$PREV" >> "$GITHUB_ENV"
            echo "prev_task_definition_arn=$PREV" >> "$GITHUB_OUTPUT"
          fi

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@8d79160660ad39c402a16e5fc7cd2a32e8f7d6b7 # v1.9.1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy to Amazon ECS
        id: deploy-ecs
        uses: aws-actions/amazon-ecs-deploy-task-definition@c465972ecbd160473f22e683363b422a5412a3de # v2.6.3
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: backend-${{ env.ENV }}
          cluster: backend-cluster-${{ env.ENV }}
          wait-for-service-stability: true

      - name: Verify ECS deployment status
        id: verify-deployment
        run: |
          MAX_ATTEMPTS=20
          SLEEP_SECONDS=5
          ATTEMPT=0

          while (( ATTEMPT < MAX_ATTEMPTS )); do
            ATTEMPT=$((ATTEMPT + 1))

            if ! STATES=$(aws ecs describe-services \
              --cluster "backend-cluster-${{ env.ENV }}" \
              --services "backend-${{ env.ENV }}" \
              --query 'services[0].deployments[?status==`PRIMARY`].rolloutState' \
              --output text 2>&1); then
              echo "❌ AWS CLI call failed: $STATES"
              exit 1
            fi

            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS — rollout state: $STATES"

            if [[ "$STATES" == "COMPLETED" ]]; then
              echo "✅ Deployment completed successfully: $STATES"
              exit 0
            fi

            if [[ "$STATES" == "FAILED" ]]; then
              echo "❌ Deployment failed: $STATES"
              exit 1
            fi

            # IN_PROGRESS — wait and retry
            echo "⏳ Deployment still in progress, waiting ${SLEEP_SECONDS}s..."
            sleep $SLEEP_SECONDS
          done

          echo "❌ Timed out waiting for deployment to complete (state: $STATES after $((MAX_ATTEMPTS * SLEEP_SECONDS))s)"
          exit 1

      - name: Clean up
        run: |
          # Clean up temporary files
          rm -f task-definition.json || true

      - name: Publish DORA Metrics
        if: always()
        uses: ./.github/actions/publish-dora-metrics
        with:
          deployment-outcome: ${{ steps.verify-deployment.outcome || 'failure' }}
          service: "backend"
          environment: ${{ env.ENV }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deployment Summary
        if: always()
        run: |
          echo "::group::=== Deployment Summary ==="
          echo "Environment: ${{ env.ENV }}"
          echo "Image tag: ${{ steps.get-sha.outputs.sha }}"
          echo "AWS Region: ${{ secrets.AWS_REGION }}"

          # Check if the ECS deployment step was successful
          if [[ "${{ steps.deploy-ecs.outcome }}" == "success" ]]; then
            echo "✅ Deployment completed successfully!"
            echo "🌐 The backend service has been updated in the ${{ env.ENV }} environment"

            # Get the service URL if available
            SERVICE_URL=$(aws ecs describe-services --cluster "backend-cluster-${{ env.ENV }}" --services "backend-${{ env.ENV }}" \
              --query "services[0].loadBalancers[0].targetGroupArn" --output text 2>/dev/null || echo "")
              
            if [[ ! -z "$SERVICE_URL" && "$SERVICE_URL" != "None" ]]; then
              echo "Service target group: $SERVICE_URL"
            fi
            
          else
            echo "❌ Deployment failed!"
            echo "🔍 Please check the logs above for error details"
            echo "⚠️  The ${{ env.ENV }} environment may still be running the previous version"
          fi

          echo "::endgroup::"
