# Calibration Sandbox Deployment Workflow
# Builds the Python image that computes calibration coefficients and deploys it to Lambda

name: Calibration Sandbox Deployment Workflow

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "The deployment environment (dev, staging, prod)"
        required: true
        type: string
      ref:
        description: "Git ref (commit SHA, branch, or tag) to deploy - leave empty to deploy current branch latest commit"
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      environment:
        description: "The deployment environment (dev, staging, prod)"
        required: true
        type: string
      ref:
        description: "Git ref (commit SHA, branch, or tag) to deploy - leave empty to deploy current branch latest commit"
        required: false
        type: string
        default: ""

env:
  ENV: ${{ inputs.environment }}

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    name: Build and Deploy Calibration Lambda
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.sha }}

      - name: Get Checked Out SHA
        id: get-sha
        run: |
          ACTUAL_SHA=$(git rev-parse HEAD)
          echo "sha=$ACTUAL_SHA" >> $GITHUB_OUTPUT
          echo "Checked out SHA: $ACTUAL_SHA"

      - name: Capture Deployment Start Time
        uses: ./.github/actions/capture-dora-start

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set environment variables
        run: |
          echo "ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}" >> $GITHUB_ENV
          echo "IMAGE_TAG=${{ steps.get-sha.outputs.sha }}" >> $GITHUB_ENV
          echo "ECR_REPO=calibration-sandbox-${{ env.ENV }}" >> $GITHUB_ENV
          echo "FUNCTION_NAME=calibration-sandbox-${{ env.ENV }}" >> $GITHUB_ENV

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        working-directory: apps/calibration-sandbox
        run: |
          set -euo pipefail

          FULL_IMAGE="${ECR_REGISTRY}/${ECR_REPO}:${IMAGE_TAG}"

          echo "Building calibration-sandbox..."
          docker build \
            -f functions/python/Dockerfile \
            -t "${FULL_IMAGE}" \
            --platform linux/amd64 \
            .

          echo "Pushing ${FULL_IMAGE}..."
          docker push "${FULL_IMAGE}"

          echo "image=${FULL_IMAGE}" >> $GITHUB_OUTPUT
          echo "Image pushed: ${FULL_IMAGE}"

      - name: Update Lambda function code
        id: update-lambda
        run: |
          set -euo pipefail

          echo "Updating Lambda function: ${FUNCTION_NAME}"
          aws lambda update-function-code \
            --function-name "${FUNCTION_NAME}" \
            --image-uri "${{ steps.build-image.outputs.image }}" \
            --output json > /dev/null

          echo "Waiting for function update to complete..."
          aws lambda wait function-updated-v2 \
            --function-name "${FUNCTION_NAME}"

          echo "Lambda function updated: ${FUNCTION_NAME}"

      - name: Verify deployment
        run: |
          set -euo pipefail

          CODE_SHA=$(aws lambda get-function-configuration \
            --function-name "${FUNCTION_NAME}" \
            --query "CodeSha256" \
            --output text)

          echo "Function: ${FUNCTION_NAME}"
          echo "  Code SHA: ${CODE_SHA}"
          echo "  Image: ${{ steps.build-image.outputs.image }}"

      - name: Publish DORA Metrics
        if: always()
        uses: ./.github/actions/publish-dora-metrics
        with:
          deployment-outcome: ${{ steps.update-lambda.outcome == 'success' && 'success' || 'failure' }}
          service: "calibration-sandbox"
          environment: ${{ inputs.environment }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deployment Summary
        if: always()
        run: |
          echo "::group::=== Calibration Sandbox Deployment Summary ==="
          echo "Environment: ${{ env.ENV }}"
          echo "Function: ${FUNCTION_NAME}"
          echo "Image: ${{ steps.build-image.outputs.image }}"

          if [[ "${{ steps.update-lambda.outcome }}" == "success" ]]; then
            echo "calibration-sandbox deployed successfully"
          else
            echo "calibration-sandbox deployment failed"
          fi
          echo "::endgroup::"
