# Deployment Workflow
# Main orchestrator for infrastructure and application deployments

name: Deployment Workflow

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      environment:
        description: "Target environment (dev, prod)"
        required: true
        type: string
      ref:
        description: "Git ref (commit SHA, branch, or tag) to deploy"
        required: false
        type: string
        default: ""
      deploy_infrastructure:
        description: "Whether to deploy infrastructure"
        required: false
        type: boolean
        default: true
      deploy_all:
        description: "Whether to deploy all applications regardless of changes"
        required: false
        type: boolean
        default: false
      deploy_app:
        description: "Comma-separated apps to force deploy (e.g. web,backend). Leave empty for change detection."
        required: false
        type: string
        default: ""

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  detect:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      deploy_sha: ${{ steps.pin.outputs.sha }}
      infra_changed: ${{ steps.infra.outputs.changed }}
      affected_apps: ${{ steps.apps.outputs.affected_apps }}
      has_affected_apps: ${{ steps.apps.outputs.has_affected_apps }}
      macro_sandbox_languages: ${{ steps.apps.outputs.macro_sandbox_languages }}
      # Whether each deploy job is wanted for this run. A skipped job publishes
      # no outputs, so a child cannot otherwise tell "not needed" from "skipped
      # because its own parent failed".
      # Dev infrastructure changes only from main, so it always matches main. App deploys
      # from a branch still run, because a parent that is not needed does not stop them.
      infrastructure_needed: ${{ (inputs.environment != 'dev' || github.ref == 'refs/heads/main') && ((github.event_name == 'workflow_dispatch' && inputs.deploy_infrastructure) || (github.event_name != 'workflow_dispatch' && steps.infra.outputs.changed == 'true')) }}
      migrations_needed: ${{ inputs.deploy_all || contains(inputs.deploy_app, 'migration') || (inputs.deploy_app == '' && contains(fromJSON(steps.apps.outputs.affected_apps), '@repo/database')) }}
      backend_needed: ${{ inputs.deploy_all || contains(inputs.deploy_app, 'backend') || (inputs.deploy_app == '' && contains(fromJSON(steps.apps.outputs.affected_apps), 'backend')) }}
      frontend_needed: ${{ inputs.deploy_all || contains(inputs.deploy_app, 'web') || (inputs.deploy_app == '' && contains(fromJSON(steps.apps.outputs.affected_apps), 'web')) }}
      docs_needed: ${{ inputs.deploy_all || contains(inputs.deploy_app, 'docs') || (inputs.deploy_app == '' && contains(fromJSON(steps.apps.outputs.affected_apps), 'docs')) }}
      databricks_needed: ${{ inputs.deploy_all || contains(inputs.deploy_app, 'databricks') || (inputs.deploy_app == '' && contains(fromJSON(steps.apps.outputs.affected_apps), 'data')) }}
      macro_sandbox_needed: ${{ inputs.deploy_all || contains(inputs.deploy_app, 'macro-sandbox') || (inputs.deploy_app == '' && contains(fromJSON(steps.apps.outputs.affected_apps), 'macro-sandbox') && steps.apps.outputs.macro_sandbox_languages != '[]') }}
      calibration_sandbox_needed: ${{ inputs.deploy_all || contains(inputs.deploy_app, 'calibration-sandbox') || (inputs.deploy_app == '' && contains(fromJSON(steps.apps.outputs.affected_apps), 'calibration-sandbox')) }}
    steps:
      - name: Validate environment
        env:
          TARGET_ENV: ${{ inputs.environment }}
        run: |
          case "$TARGET_ENV" in
            dev | prod) ;;
            *) echo "::error::Unknown environment '$TARGET_ENV'"; exit 1 ;;
          esac

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # The branch policy and the prod role's ref condition both check the branch the run
      # started from, not what it checks out, so the ref input is checked here. Every job then
      # deploys this one commit, even if the branch moves after the approval.
      - name: Pin the commit to deploy
        id: pin
        env:
          TARGET_ENV: ${{ inputs.environment }}
        run: |
          SHA=$(git rev-parse HEAD)
          if [ "$TARGET_ENV" = "prod" ]; then
            case "$GITHUB_REF" in
              refs/heads/main | refs/heads/release/*) ;;
              *) echo "::error::Prod deploys start from main or a release branch, not $GITHUB_REF"; exit 1 ;;
            esac
            if [ "$SHA" != "$GITHUB_SHA" ]; then
              echo "::error::The ref input resolves to ${SHA:0:7}, but this run started from ${GITHUB_SHA:0:7}. Start the release from the branch you want to deploy."
              exit 1
            fi
          fi
          echo "Deploying ${SHA:0:7}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Detect Infra Changes
        id: infra
        env:
          BASE: ${{ github.event.before }}
          HEAD: ${{ steps.pin.outputs.sha }}
        run: |
          # Did this push change infrastructure/ or the SQL views OpenTofu reads from apps/data?
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "No previous push to compare with (manual run or new branch), so infrastructure counts as changed."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Comparing ${BASE:0:7}..${HEAD:0:7}"
          CHANGED=$(git diff --name-only "$BASE" "$HEAD" | grep -E '^(infrastructure/|apps/data/src/views/)' || true)
          if [ -n "$CHANGED" ]; then
            echo "Infrastructure changed:"
            echo "$CHANGED" | sed 's/^/  /'
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No infrastructure changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-nodejs-pnpm
        with:
          node-version: "24"

      - name: Detect Affected Packages
        id: apps
        uses: ./.github/actions/detect-affected-packages

  # The one approval a prod deploy waits for, before anything is applied or
  # deployed. Runs on every deploy that would change something, even when no
  # infrastructure changed, so app-only deploys are gated too. Prod binds
  # prod-approval, which carries the reviewers; dev binds its own environment,
  # which has none, so dev deploys pass straight through.
  approval-gate:
    name: Approval Gate
    needs: [detect]
    if: >-
      inputs.deploy_all ||
      inputs.deploy_app != '' ||
      inputs.deploy_infrastructure ||
      needs.detect.outputs.infra_changed == 'true' ||
      contains(fromJSON(needs.detect.outputs.affected_apps), 'web') ||
      contains(fromJSON(needs.detect.outputs.affected_apps), 'backend') ||
      contains(fromJSON(needs.detect.outputs.affected_apps), '@repo/database') ||
      contains(fromJSON(needs.detect.outputs.affected_apps), 'docs') ||
      contains(fromJSON(needs.detect.outputs.affected_apps), 'data') ||
      contains(fromJSON(needs.detect.outputs.affected_apps), 'macro-sandbox') ||
      contains(fromJSON(needs.detect.outputs.affected_apps), 'calibration-sandbox')
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment == 'prod' && 'prod-approval' || inputs.environment }}
    permissions:
      contents: read
    steps:
      - name: Await Approval for Deployment
        run: echo "Approved deployment for ${{ inputs.environment }} environment."

  deploy-infrastructure:
    name: Deploy Infrastructure
    needs: [detect, approval-gate]
    if: needs.detect.outputs.infrastructure_needed == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/tofu.yml
    with:
      environment: ${{ inputs.environment }}
      ref: ${{ needs.detect.outputs.deploy_sha }}
      tofu_version: "1.9.0"
    secrets: inherit

  # Each job below runs only if every deploy job it needs either succeeded or
  # was skipped because this run did not need it. A parent that was needed but
  # skipped (its own parent failed) stops the chain here too.
  database-migrations:
    name: Database Migrations
    needs: [deploy-infrastructure, detect, approval-gate]
    if: >-
      always() &&
      needs.detect.result == 'success' &&
      needs.approval-gate.result == 'success' &&
      (needs.deploy-infrastructure.result == 'success' || (needs.deploy-infrastructure.result == 'skipped' && needs.detect.outputs.infrastructure_needed == 'false')) &&
      needs.detect.outputs.migrations_needed == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/database-migrations.yml
    with:
      environment: ${{ inputs.environment }}
      timeout_minutes: 10
      ref: ${{ needs.detect.outputs.deploy_sha }}
    secrets: inherit

  deploy-backend:
    name: Deploy Backend
    needs: [deploy-infrastructure, database-migrations, detect, approval-gate]
    if: >-
      always() &&
      needs.detect.result == 'success' &&
      needs.approval-gate.result == 'success' &&
      (needs.deploy-infrastructure.result == 'success' || (needs.deploy-infrastructure.result == 'skipped' && needs.detect.outputs.infrastructure_needed == 'false')) &&
      (needs.database-migrations.result == 'success' || (needs.database-migrations.result == 'skipped' && needs.detect.outputs.migrations_needed == 'false')) &&
      needs.detect.outputs.backend_needed == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-backend.yml
    with:
      environment: ${{ inputs.environment }}
      ref: ${{ needs.detect.outputs.deploy_sha }}
    secrets: inherit

  deploy-frontend:
    name: Deploy Frontend
    needs: [deploy-infrastructure, deploy-backend, detect, approval-gate]
    if: >-
      always() &&
      needs.detect.result == 'success' &&
      needs.approval-gate.result == 'success' &&
      (needs.deploy-infrastructure.result == 'success' || (needs.deploy-infrastructure.result == 'skipped' && needs.detect.outputs.infrastructure_needed == 'false')) &&
      (needs.deploy-backend.result == 'success' || (needs.deploy-backend.result == 'skipped' && needs.detect.outputs.backend_needed == 'false')) &&
      needs.detect.outputs.frontend_needed == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-nextjs-opennext.yml
    with:
      environment: ${{ inputs.environment }}
      ref: ${{ needs.detect.outputs.deploy_sha }}
    secrets: inherit

  deploy-docs:
    name: Deploy Documentation
    needs: [deploy-infrastructure, detect, approval-gate]
    if: >-
      always() &&
      needs.detect.result == 'success' &&
      needs.approval-gate.result == 'success' &&
      (needs.deploy-infrastructure.result == 'success' || (needs.deploy-infrastructure.result == 'skipped' && needs.detect.outputs.infrastructure_needed == 'false')) &&
      needs.detect.outputs.docs_needed == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-docs.yml
    with:
      environment: ${{ inputs.environment }}
      ref: ${{ needs.detect.outputs.deploy_sha }}
    secrets: inherit

  deploy-databricks:
    name: Deploy Databricks
    # Mixed-version macro rollout: backend normalization lands before the
    # Databricks producer adapter. A backend this run does not need still
    # permits data-only deploys.
    needs: [deploy-infrastructure, deploy-backend, detect, approval-gate]
    if: >-
      always() &&
      needs.detect.result == 'success' &&
      needs.approval-gate.result == 'success' &&
      (needs.deploy-infrastructure.result == 'success' || (needs.deploy-infrastructure.result == 'skipped' && needs.detect.outputs.infrastructure_needed == 'false')) &&
      (needs.deploy-backend.result == 'success' || (needs.deploy-backend.result == 'skipped' && needs.detect.outputs.backend_needed == 'false')) &&
      needs.detect.outputs.databricks_needed == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-databricks.yml
    with:
      environment: ${{ inputs.environment }}
      ref: ${{ needs.detect.outputs.deploy_sha }}
    secrets: inherit

  deploy-macro-sandbox:
    name: Deploy Macro Sandbox
    # Sandbox simplification is last: backend normalization, the web producer,
    # and the Databricks adapter must be deployed or not needed first.
    needs:
      [
        deploy-infrastructure,
        deploy-backend,
        deploy-frontend,
        deploy-databricks,
        detect,
        approval-gate,
      ]
    if: >-
      always() &&
      needs.detect.result == 'success' &&
      needs.approval-gate.result == 'success' &&
      (needs.deploy-infrastructure.result == 'success' || (needs.deploy-infrastructure.result == 'skipped' && needs.detect.outputs.infrastructure_needed == 'false')) &&
      (needs.deploy-backend.result == 'success' || (needs.deploy-backend.result == 'skipped' && needs.detect.outputs.backend_needed == 'false')) &&
      (needs.deploy-frontend.result == 'success' || (needs.deploy-frontend.result == 'skipped' && needs.detect.outputs.frontend_needed == 'false')) &&
      (needs.deploy-databricks.result == 'success' || (needs.deploy-databricks.result == 'skipped' && needs.detect.outputs.databricks_needed == 'false')) &&
      needs.detect.outputs.macro_sandbox_needed == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-macro-sandbox.yml
    with:
      environment: ${{ inputs.environment }}
      ref: ${{ needs.detect.outputs.deploy_sha }}
      languages: ${{ (inputs.deploy_all || contains(inputs.deploy_app, 'macro-sandbox')) && '["python","javascript","r"]' || needs.detect.outputs.macro_sandbox_languages }}
    secrets: inherit

  deploy-calibration-sandbox:
    name: Deploy Calibration Sandbox
    # The backend has to be carrying the function name before the function can
    # answer anything, so it deploys after the same set the macro sandbox waits on.
    needs:
      [
        deploy-infrastructure,
        deploy-backend,
        deploy-frontend,
        deploy-databricks,
        detect,
        approval-gate,
      ]
    if: >-
      always() &&
      needs.detect.result == 'success' &&
      needs.approval-gate.result == 'success' &&
      (needs.deploy-infrastructure.result == 'success' || (needs.deploy-infrastructure.result == 'skipped' && needs.detect.outputs.infrastructure_needed == 'false')) &&
      (needs.deploy-backend.result == 'success' || (needs.deploy-backend.result == 'skipped' && needs.detect.outputs.backend_needed == 'false')) &&
      (needs.deploy-frontend.result == 'success' || (needs.deploy-frontend.result == 'skipped' && needs.detect.outputs.frontend_needed == 'false')) &&
      (needs.deploy-databricks.result == 'success' || (needs.deploy-databricks.result == 'skipped' && needs.detect.outputs.databricks_needed == 'false')) &&
      needs.detect.outputs.calibration_sandbox_needed == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-calibration-sandbox.yml
    with:
      environment: ${{ inputs.environment }}
      ref: ${{ needs.detect.outputs.deploy_sha }}
    secrets: inherit
