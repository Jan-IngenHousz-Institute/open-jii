  # Public metrics pipeline (post-landing)
  - num: 41
    id: metrics-mv-freshness
    name: Public metrics staleness
    family: observability
    source: dbx
    phase: P2
    # Inactive until the heartbeat export task that publishes this lands.
    active: false
    slots: [alert, dashboard]
    severity: critical
    signal:
