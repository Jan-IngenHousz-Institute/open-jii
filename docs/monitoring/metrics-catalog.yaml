    baseline: { method: same-weekday-4w, anomaly_pct: 100 }
    runbook: docs/runbooks/gold-materialization-age.md
    notes: >
      Minutes since gold last materialized, from max(status_updated_at) in
      experiment_status. Split out of 10 during implementation: a fixed
      threshold could not serve both environments while the centrum pipeline ran
      on a weekday-daytime schedule in dev (until 23 Sep; continuous since), so this
      compares against its own 4-week pattern instead. A hard prod-only
      staleness rule belongs in the per-environment Grafana rules (P2b).

