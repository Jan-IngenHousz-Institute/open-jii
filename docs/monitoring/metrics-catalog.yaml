    id: registrations
    name: New registrations
    family: usage
    source: pg
    phase: P1
    active: true
    # Weekly only: the publisher emits one datapoint per week, so a pulse slot would
    # render 0 on six days in seven. It joins the pulse when the publisher goes daily.
    slots: [weekly]
    signal:
      namespace: OpenJII/UserRegistrations
      metric: WeeklyNewUsers
      # Maximum, not Sum: the publisher writes one gauge a week at publish time, and a
      # Sum would turn a week the publisher failed into "0 signups" instead of silence.
      stat: Maximum
      dimensions: { Environment: "${ENVIRONMENT}" }
    baseline: { method: wow }
    notes: >
      Weekly granularity until the metrics-publisher promotion adds daily counts. Stamped
      at publish time (Monday 06:00 UTC), one hour before the weekly note's window closes,
      so the trailing seven-day window always contains it.

