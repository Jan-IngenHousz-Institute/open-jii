  # Lakehouse
  - num: 10
    id: dlt-heartbeat
    name: Heartbeat collector dead-man
    family: observability
    source: dbx
    phase: P2
    # Stays inactive until the export task that publishes CollectorHeartbeat lands.
    # An absence rule against a producer that does not exist yet alarms on its first
    # run and never stops, which is the failure this metric exists to detect.
    active: false
    slots: [alert, dashboard]
    severity: critical
    signal:
      namespace: OpenJII/Data
      metric: CollectorHeartbeat
      stat: Maximum
      dimensions: { Environment: "${ENVIRONMENT}" }
    baseline: { nodata: alert }
    runbook: docs/runbooks/dlt-heartbeat.md
    notes: >
      Value is always 1; only its absence carries meaning, so the absence rule is the
      whole metric: the composer renders it as an anomaly, and the Grafana NoData rule
      does the same once it lands. Deliberately has no threshold.

