# Platform heartbeat metrics catalog.
# Single source of truth for the Grafana report dashboards, the Grafana alert rules, the
# runbooks, and the openjii-triage and openjii-daily-round skills. Numbering is
# append-only; see `passes` below.
#
# Field notes:
# - family: observability (issues) | usage (levels)
# - source: aws (native CloudWatch) | dbx (Databricks heartbeat job) | pg (metrics-publisher)
#           | posthog | gh (GitHub Actions) | composer (retired)
# - phase: roadmap phase in which the signal starts existing (P1..P5)
# - active: the entry is charted on a report dashboard today; inactive entries are
#           documentation until their producer publishes
# - slots: alert | exception | weekly | dashboard | s3. An observability entry with
#   exception or alert is on the daily report; weekly puts an entry on the weekly
#   report; alert additionally means a Grafana rule carries the entry's id
# - area: where on its report an entry sits. Daily data path: volume (the how-much chart) |
#   latency (the how-long chart) | path (the tiles beneath them). Daily rows: web | api |
#   ingest | lakehouse | sandboxes. Weekly: usage (people and data) | platform
# - name: what the report shows, in the words of whoever reads it
# - severity: critical | warning (alert slot only; critical only repeats faster)
# - signal.dimensions values support ${ENV_PLACEHOLDER} resolution on the dashboards
# - signal.period: CloudWatch period in seconds, for a signal counted per period. The
#   weekly report compares its last two periods instead of reading the latest value
# - baseline: for an entry with an alert rule, the limit that rule enforces. A max (a count's
#   is per five minutes, like its rule), any-nonzero, or a min floor colours the entry's row on
#   the daily report's board and is drawn on its chart. The rest is intent for a rule that does
#   not exist yet

version: 1

# A num in a runbook, a Slack line or an incident note has to mean one thing forever, so
# numbers are never reused. A retired entry keeps its num and goes active: false; a merged
# entry leaves a gap recorded here; a new entry takes the next num after the last pass.
# The consistency tests hold the catalog to this block.
passes:
  - date: 2026-08-14
    range: [1, 63]
    gaps: [3]
    note: initial metric-by-metric review; 3 merged into 2
  - date: 2026-09-14
    range: [64, 64]
    note: gold materialization age split out of 10
  - date: 2026-09-22
    range: [65, 66]
    note: the digest's own two lambdas, so the reporter's silence is itself reportable
  - date: 2026-09-26
    range: [67, 70]
    note: rolling 7-day usage counters, the weekly report's headline numbers
  - date: 2026-09-26
    range: [71, 78]
    note: the signals of alert rules that had no entry, so every rule has a place on the daily report
  - date: 2026-09-26
    range: [79, 80]
    note: site uptime and registered researchers, for the weekly report
  - date: 2026-09-26
    range: [81, 93]
    note: the data path from device to macro results, how much flows and how long each hop takes
  - date: 2026-09-27
    range: [94, 94]
    note: exceptions from PostHog error tracking, for the daily report's errors section
  - date: 2026-09-27
    range: [95, 95]
    note: the whole trip, from the IoT broker receiving a message to its row readable through the API
  - date: 2026-09-27
    range: [96, 96]
    note: the heartbeat export's failed collectors, so a broken one is told from a quiet one
  - date: 2026-10-01
    range: [97, 97]
    note: the memory each pipeline driver keeps, which warned of the September stall hours ahead

metrics:
  # Ingest path
  - num: 1
    id: connected-devices
    name: Connected devices vs registered fleet
    family: usage
    source: dbx
    phase: P3
    active: false
    slots: [weekly, dashboard]
    notes: Fleet-indexing / device_last_activity based; sudden-drop alerting revisited post-P3.

  - num: 2 # merged with 3 in the pass
    id: ingest-forwarding-failures
    name: Measurements lost
    family: observability
    area: ingest
    source: aws
    phase: P1
    active: true
    slots: [alert, exception, dashboard]
    severity: critical
    signal:
      namespace: AWS/IoT
      # Keyed on RuleName and ActionType; a schema naming only RuleName matches nothing.
      search: SEARCH('{AWS/IoT,ActionType,RuleName} MetricName="Failure"', 'Sum')
      stat: Sum
    baseline: { method: same-weekday-4w, anomaly: any-nonzero }
    runbook: docs/runbooks/ingest-forwarding-failures.md
    notes: Messages accepted by the broker but never forwarded to Kinesis/S3. Data loss risk.

  - num: 4
    id: iot-auth-failures
    name: Connection failures
    family: observability
    area: ingest
    source: aws
    phase: P1
    active: true
    slots: [exception, dashboard]
    signal:
      namespace: AWS/IoT
      # Every Connect.* metric is keyed on Protocol (MQTT), never dimensionless.
      search: SEARCH('{AWS/IoT,Protocol} MetricName="Connect.AuthError" OR MetricName="Connect.ClientError" OR MetricName="Connect.ServerError"', 'Sum')
      stat: Sum
    baseline: { method: same-weekday-4w, anomaly_pct: 200 }
    runbook: docs/runbooks/iot-auth-failures.md
    notes: Cert expiry, policy denials, broken device configs surface here first.

  - num: 5
    id: per-device-message-topn
    name: Per-device message volume top-N
    family: usage
    source: dbx
    phase: P3
    active: false
    slots: [s3, weekly]
    notes: Detail stays in heartbeat volume JSON; never a CloudWatch metric (cardinality rule).

  - num: 6
    id: cert-expiry-horizon
    name: Certificate expiry horizon / stuck rotations
    family: observability
    source: pg
    phase: P3
    active: false
    slots: [alert, weekly]
    severity: warning
    runbook: docs/runbooks/cert-expiry-horizon.md
    notes: Certs <30d to expiry; devices whose rotation did not complete.

  - num: 7
    id: kinesis-incoming
    name: Messages received
    family: usage
    area: platform
    source: aws
    phase: P1
    active: true
    slots: [dashboard]
    signal:
      namespace: AWS/Kinesis
      metric: IncomingRecords
      stat: Sum
      dimensions: { StreamName: "${KINESIS_STREAM_NAME}" }
    baseline: { method: same-weekday-4w, anomaly_pct: 50 }
    notes: >
      Top-line ingest volume on the Data pipeline dashboard; the reports count device publishes (81) instead. The anomaly_pct is
      inert until an ingest-collapse rule lands in P2b, which is where "producers
      stopped publishing" should alarm (iterator age only catches a stalled
      consumer).

  - num: 8
    id: ingest-lag
    name: Ingest lag
    family: observability
    area: ingest
    source: aws
    phase: P1
    active: true
    slots: [alert, dashboard]
    severity: warning
    signal:
      namespace: AWS/Kinesis
      metric: GetRecords.IteratorAgeMilliseconds
      stat: Maximum
      unit: milliseconds
      dimensions: { StreamName: "${KINESIS_STREAM_NAME}" }
    # Ten minutes of lag is a fault in prod. Dev's consumer ran on a schedule until 23 Sep,
    # when its lag sat near 2.8M ms; continuous since, it still peaked at 156 minutes in the
    # five days after, so dev keeps two hours.
    baseline:
      method: threshold
      max: 600000
      per_environment:
        dev: { method: threshold, max: 7200000 }
    runbook: docs/runbooks/ingest-lag.md
    notes: The single best pipeline-lag alarm. Consumer down => age climbs while ingest looks healthy.

  - num: 9
    id: kinesis-write-throttling
    name: Ingest writes throttled
    family: observability
    area: ingest
    source: aws
    phase: P1
    active: true
    slots: [alert, dashboard]
    severity: warning
    signal:
      namespace: AWS/Kinesis
      metric: WriteProvisionedThroughputExceeded
      stat: Sum
      dimensions: { StreamName: "${KINESIS_STREAM_NAME}" }
    baseline: { method: threshold, max: 0 }
    runbook: docs/runbooks/kinesis-write-throttling.md

  # Lakehouse
  - num: 10
    id: dlt-heartbeat
    name: Collector running
    family: observability
    area: lakehouse
    source: dbx
    phase: P2
    active: true
    slots: [alert, dashboard]
    severity: warning
    signal:
      namespace: OpenJII/Data
      metric: CollectorHeartbeat
      stat: Maximum
      dimensions: { Environment: "${ENVIRONMENT}" }
    baseline: { nodata: alert }
    runbook: docs/runbooks/dlt-heartbeat.md
    notes: >
      Value is always 1; only its absence carries meaning, so the absence rule is the
      whole metric: the dead-man rule fires on NoData, and the daily tile reads Stopped
      over the same window. Deliberately has no threshold.

