<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; font-src 'self'; style-src 'self'" />
    <title>openJII</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <main class="page">
      <section class="card">
