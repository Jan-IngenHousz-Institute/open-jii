<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; font-src 'self'; style-src 'self'" />
    <title>openJII</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <main class="page">
      <section class="card">
        <img class="logo logo-light" src="../assets/logo.svg" alt="openJII" /><img class="logo logo-dark" src="../assets/logo-white.svg" alt="openJII" />
        <h1>Sign in to openJII</h1>
        <p>Your browser opens so you can sign in with email, a passkey, GitHub or ORCID. You come straight back here afterwards.</p>
        <button id="continue" class="button block" type="button">Continue in browser</button>
        <p id="waiting" class="small note" hidden>Waiting for your browser. Finish signing in there.</p>
      </section>
    </main>
    <script src="signin.js"></script>
  </body>
</html>
