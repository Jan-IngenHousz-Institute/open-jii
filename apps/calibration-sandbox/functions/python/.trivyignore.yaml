# Calibration sandbox image (public.ecr.aws/lambda/python:3.12). All entries are
# AWS-managed components awaiting an AWS base republish. Sandbox is VPC-isolated:
# no outbound HTTP, no IAM creds, and a calibration script runs against an
# allowlisted __builtins__ whose __import__ reaches numpy, pandas, scipy, math,
# statistics, json, re and the shared quality gates, and nothing else. `ssl` is
# not among them, which `tests/test_isolation.py` holds.
# Verify with the ghcr trivy DB (mirror.gcr.io lags): --db-repository ghcr.io/aquasecurity/trivy-db:2
#
# Do NOT merge into the root .trivyignore: that one is read by the dependency
# scan of our own lockfile, which must keep catching these CVEs in app code.

vulnerabilities:
  # aws-lambda-rie, Go stdlib 1.26.9, fixed in 1.26.10. The base entrypoint runs
  # RIE only when AWS_LAMBDA_RUNTIME_API is unset, which Lambda always sets.
  - id: CVE-2026-111943
    purls:
      - "pkg:golang/stdlib@v1.26.9"
    statement: "crypto/x509 denylist for distrusted CA intermediates. RIE never runs in production."
    expired_at: 2026-11-30
