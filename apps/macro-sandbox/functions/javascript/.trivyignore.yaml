# JS sandbox image (public.ecr.aws/lambda/nodejs:24). All entries are AWS-managed
# components awaiting an AWS base republish. Sandbox is VPC-isolated: no outbound
# HTTP, no IAM creds, macro code cannot spawn processes.
# Verify with the ghcr trivy DB (mirror.gcr.io lags): --db-repository ghcr.io/aquasecurity/trivy-db:2

vulnerabilities:
  # Runtime's bundled npm CLI (var/lang/lib/node_modules/npm/node_modules),
  # never invoked by the sandbox.
  # brace-expansion@5.0.7, two CVE ids for the same copy. Fixed in 5.0.8 / 5.0.9.
  - id: CVE-2026-14257
    statement: "brace-expansion ReDoS. npm never invoked at runtime."
    expired_at: 2026-11-05
  - id: CVE-2026-69152
    statement: "DoS via unbounded arrays, same copy."
    expired_at: 2026-11-05
  # tar@7.5.19, fixed in 7.5.21.
  - id: CVE-2026-73566
    statement: "tar DoS via crafted long-path archive. npm extracts nothing at runtime."
    expired_at: 2026-11-05
  # ip-address@10.2.0 (via socks), fixed in 10.3.1.
  - id: CVE-2026-69192
    statement: "ip-address octet-parsing confusion. No SOCKS proxying."
    expired_at: 2026-11-05

  # openssl-fips-provider-latest / openssl-snapsafe-libs@3.5.7-2.amzn2023.0.1, fixed in .0.2.
  - id: CVE-2026-14456
    statement: "QUIC server memory-growth DoS. Sandbox runs no QUIC or TLS server."
    expired_at: 2026-11-05
