  # aws-lambda-rie, Go stdlib 1.26.9, fixed in 1.26.10. The base entrypoint runs
  # RIE only when AWS_LAMBDA_RUNTIME_API is unset, which Lambda always sets.
  - id: CVE-2026-111943
    purls:
      - "pkg:golang/stdlib@v1.26.9"
    statement: "crypto/x509 denylist for distrusted CA intermediates. RIE never runs in production."
    expired_at: 2026-11-05

