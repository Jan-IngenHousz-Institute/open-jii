# JS sandbox image (public.ecr.aws/lambda/nodejs:24). All entries are AWS-managed
# components awaiting an AWS base republish. Sandbox is VPC-isolated: no outbound
# HTTP, no IAM creds, macro code cannot spawn processes.
# Verify with the ghcr trivy DB (mirror.gcr.io lags): --db-repository ghcr.io/aquasecurity/trivy-db:2

vulnerabilities:
  # AL2023 packages in the 2023.12.20260914 base. AWS names the fixed builds,
  # but the repos do not carry them yet, so upgrading in the Dockerfile is a
  # no-op ("Nothing to do").
  - id: CVE-2026-78367
    purls:
      - "pkg:rpm/amazon/rpm@4.16.1.3-29.amzn2023.0.7"
      - "pkg:rpm/amazon/rpm-libs@4.16.1.3-29.amzn2023.0.7"
    statement: "rpmbuild tar-spec macro injection. No rpm operations at runtime."
    expired_at: 2026-11-05
  - id: CVE-2026-84233
    purls:
      - "pkg:rpm/amazon/rpm@4.16.1.3-29.amzn2023.0.7"
      - "pkg:rpm/amazon/rpm-libs@4.16.1.3-29.amzn2023.0.7"
    statement: "rpmuncompress macro expansion on crafted filenames. No rpm operations at runtime."
    expired_at: 2026-11-05
  - id: CVE-2026-80230
    purls:
      - "pkg:rpm/amazon/curl-minimal@8.21.0-5.amzn2023.0.1"
      - "pkg:rpm/amazon/libcurl-minimal@8.21.0-5.amzn2023.0.1"
    statement: "curl public key pinning bypass. The sandbox makes no outbound TLS connections."
    expired_at: 2026-11-05
  - id: CVE-2026-89161
    purls:
      - "pkg:rpm/amazon/pcre2@10.40-1.amzn2023.0.3"
      - "pkg:rpm/amazon/pcre2-syntax@10.40-1.amzn2023.0.3"
    statement: "PCRE2 JIT memory corruption. Neither the runtime nor macro code uses PCRE2."
    expired_at: 2026-11-05

  # aws-lambda-rie, Go stdlib 1.26.7, fixed in 1.26.9. The base entrypoint runs
  # RIE only when AWS_LAMBDA_RUNTIME_API is unset, which Lambda always sets.
  - id: CVE-2026-78667
    purls:
      - "pkg:golang/stdlib@v1.26.7"
    statement: "net/http Range header DoS. RIE never runs in production."
    expired_at: 2026-11-05
  - id: CVE-2026-97031
    purls:
      - "pkg:golang/stdlib@v1.26.7"
    statement: "crypto/tls ECH DoS. RIE never runs in production."
    expired_at: 2026-11-05

  # The runtime's bundled SDK tree (var/runtime/node_modules/@aws-sdk/node_modules).
  # The handler never loads @aws-sdk and macro code runs with require undefined.
  - id: CVE-2026-101898
    purls:
      - "pkg:npm/axios@1.19.0"
    statement: "axios HTTP/2 proxy and DNS settings ignored. No outbound HTTP."
    expired_at: 2026-11-05
  - id: CVE-2026-101901
    purls:
      - "pkg:npm/axios@1.19.0"
    statement: "axios HTTP/2 session DoS. No outbound HTTP."
    expired_at: 2026-11-05
  - id: CVE-2026-101903
    purls:
      - "pkg:npm/axios@1.19.0"
    statement: "axios malformed data URL DoS. SDK copy never loaded."
    expired_at: 2026-11-05
  - id: CVE-2026-101905
    purls:
      - "pkg:npm/axios@1.19.0"
    statement: "axios socket hijack via inherited createConnection. No outbound HTTP."
    expired_at: 2026-11-05
  - id: CVE-2026-101906
    purls:
      - "pkg:npm/axios@1.19.0"
    statement: "axios crafted redirect hostname DoS. No outbound HTTP."
    expired_at: 2026-11-05
  - id: CVE-2026-101907
    purls:
      - "pkg:npm/axios@1.19.0"
    statement: "axios fetch-adapter redirect SSRF. No outbound HTTP."
    expired_at: 2026-11-05
  - id: CVE-2026-101909
    purls:
      - "pkg:npm/axios@1.19.0"
    statement: "axios form-serialization prototype pollution. SDK copy never loaded."
    expired_at: 2026-11-05
  - id: CVE-2026-102276
    purls:
      - "pkg:npm/brace-expansion@1.1.18"
    statement: "brace-expansion stack exhaustion. SDK copy never loaded."
    expired_at: 2026-11-05
  - id: CVE-2026-102278
    purls:
      - "pkg:npm/brace-expansion@1.1.18"
    statement: "brace-expansion nested recursion, same copy."
    expired_at: 2026-11-05
  - id: CVE-2026-19534
    purls:
      - "pkg:npm/undici@7.29.0"
    statement: "undici WebSocket subprotocol DoS. No WebSockets."
    expired_at: 2026-11-05
  - id: CVE-2026-84961
    purls:
      - "pkg:npm/undici@7.29.0"
    statement: "undici BalancedPool TLS validation bypass. No outbound TLS."
    expired_at: 2026-11-05
