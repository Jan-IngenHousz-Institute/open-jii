# AWS Lambda Node.js base image CVEs (public.ecr.aws/lambda/nodejs:24)
# All in AWS-managed components. Fixes require AWS to publish updated base images.
# Sandbox Lambdas are VPC-isolated with no internet access and no IAM credentials.
#
# Pruned 2026-08-04 against a fresh build: AWS republished the base (updated
# Amazon Linux snapshot and runtime SDK), clearing the previous openssl/glibc/
# glib2/libsolv/libacl/libcap/RIE batches and most axios CVEs. Entries below are
# the ones still live in the built image.

vulnerabilities:
  # axios@1.16.1 in the Lambda runtime SDK
  # (var/runtime/node_modules/@aws-sdk/node_modules/axios).
  - id: GHSA-gcfj-64vw-6mp9
    statement: >-
      Node HTTP adapter can reuse an inherited proxy after interceptor
      config changes it. Sandbox has no outbound HTTP and no proxy
      configuration, so no request ever reaches the adapter's proxy logic.

  # brace-expansion@1.1.15 in the Lambda runtime SDK
  # (var/runtime/node_modules/@aws-sdk/node_modules/brace-expansion).
  - id: CVE-2026-13149
    statement: >-
      ReDoS via exponential-time complexity. Bundled inside @aws-sdk's own
      dependency tree, not invoked by sandbox code; sandbox has no outbound
      HTTP and no IAM creds, so no attacker-controlled string ever reaches it.
  - id: CVE-2026-14257
    statement: >-
      Same brace-expansion ReDoS, different CVE ID, same bundled copy.
      Bundled inside @aws-sdk's own dependency tree, not invoked by sandbox
      code; sandbox has no outbound HTTP and no IAM creds, so no
      attacker-controlled string ever reaches it.
  - id: CVE-2026-69152
    statement: >-
      brace-expansion DoS via unbounded intermediate arrays, a third CVE ID
      against the same bundled copy. Bundled inside @aws-sdk's own dependency
      tree, not invoked by sandbox code; sandbox has no outbound HTTP and no
      IAM creds, so no attacker-controlled string ever reaches it.
